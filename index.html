    if (cfg.vest) {
      const g = new THREE.Group(), dark = 0x163d2e;
      const pack = mk(new THREE.BoxGeometry(.24, .3, .07), dark, toon); pack.position.set(0, 1.3, -.135);
      const trim = mk(new THREE.BoxGeometry(.245, .03, .075), 0xf0a43a, toon); trim.position.set(0, 1.4, -.135);
      g.add(pack, trim);
      for (const s of [-1, 1]) {
        const strap = mk(new THREE.BoxGeometry(.05, .3, .03), dark, toon); strap.position.set(s * .075, 1.33, .1); strap.rotation.x = -.12;
        const flask = mk(new THREE.CylinderGeometry(.022, .022, .1, 10), 0x9fd5ea, toon); flask.position.set(s * .075, 1.33, .13);
        const capf = mk(new THREE.CylinderGeometry(.012, .012, .02, 8), 0xf0a43a, toon); capf.position.set(s * .075, 1.39, .13);
        g.add(strap, flask, capf);
      }
      put("Spine2", g);
    }
    if (cfg.poles) {
      const g = new THREE.Group();
      for (const s of [-1, 1]) {
        const pole = mk(new THREE.CylinderGeometry(.008, .008, .85, 6), 0xc9c2b8, toon);
        pole.position.set(s * .02, 1.3, -.19); pole.rotation.z = s * .55; g.add(pole);
        const grip = mk(new THREE.CylinderGeometry(.014, .014, .1, 8), 0x1d2b24, toon);
        grip.position.set(s * -.205, 1.66, -.19); grip.rotation.z = s * .55; g.add(grip);
      }
      put("Spine2", g);
    }
  }
  /* Dress a freshly parsed copy. lit: "standard" (exercise viewer) or "lambert" (hero). Returns true if toon. */
  function dress(root, lit) {
    const cfg = config();
    const toon = cfg.style === "toon";
    root.traverse((o) => {
      if (!(o.isMesh || o.isSkinnedMesh)) return;
      o.castShadow = true; o.frustumCulled = false;
      const joints = /joint/i.test(o.material.name);
      if (!toon) {
        const color = joints ? 0x2f6b4f : (matchMedia("(prefers-color-scheme: dark)").matches ? 0xc5d3cb : 0xeef2ef);
        o.material = lit === "standard"
          ? new THREE.MeshStandardMaterial({ color, roughness: joints ? .45 : .6, metalness: joints ? .1 : 0, skinning: true })
          : new THREE.MeshLambertMaterial({ color, skinning: true });
        return;
      }
      paint(o, cfg);
      o.material = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradientMap(), skinning: true });
      o.material.userData.outlineParameters = { thickness: .006, color: [.06, .1, .08], alpha: 1, visible: true };
    });
    if (toon) accessories(root, cfg, true);
    return toon;
  }
  /* Keep scenery out of the outline pass. */
  function noOutline(obj) { obj.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => { m.userData.outlineParameters = { visible: false }; }); }); }
  return { dress, noOutline, config, pick, setCustom, get saved() { return saved; }, PRESETS, CUSTOM_BASE, SKINS, SHIRTS, SHORTS, HAIRS, onChange: (f) => listeners.push(f) };
})();
</script>

<script>
/* ================= 3D trail runner (three.js) =================
   Low-poly runner jogging in place while the trail, pines and mist stream past.
   One renderer, re-attached to whichever hero is on screen. Pauses when hidden. */
window.Runner3D = (() => {
  if (!window.THREE) return null;
  let renderer, scene, camera, host = null, active = true, raf = 0, t0 = performance.now(), visible = true;
  let runner, parts = {}, trees = [], rain, ground, pathMarks = [], mats = {}, mixer = null, gen = 0, effect = null;
  const dark = matchMedia("(prefers-color-scheme: dark)");

  function palette() {
    const d = dark.matches;
    return {
      fog: d ? 0x10291e : 0x9fc3b4, ground: d ? 0x173a28 : 0x4f8a64, path: d ? 0x5a4630 : 0x9b7a52,
      pine: d ? 0x1f5038 : 0x2f6b4f, pine2: d ? 0x2a6447 : 0x3d7f5c, trunk: 0x5b3c25,
      mountain: d ? 0x23413a : 0x7fa596, shirt: 0xf0a43a, shorts: 0x163d2e, skin: 0xc68b5e, shoe: 0xf3f6f4, sole: 0x3f97be, cap: 0x163d2e,
      sun: d ? 0x9fb4ff : 0xffe2b0, hemiSky: d ? 0x3a5a7a : 0xfff1d8, hemiGround: d ? 0x0b1a12 : 0x3d6b4f, rain: d ? 0x9fc6e0 : 0xffffff,
    };
  }
  const mat = (c) => new THREE.MeshLambertMaterial({ color: c, flatShading: true });

  function limb(len, rad, color) {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad * .85, len, 7), mat(color));
    m.position.y = -len / 2; g.add(m);
    const j = new THREE.Mesh(new THREE.SphereGeometry(rad * 1.05, 8, 6), mat(color)); g.add(j);
    return g;
  }
  function buildRunner(P) {
    const r = new THREE.Group();
    const hips = new THREE.Group(); hips.position.y = 1.0; r.add(hips);
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(.2, .17, .62, 8), mat(P.shirt)); torso.position.y = .36; hips.add(torso);
    const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(.18, .19, .18, 8), mat(P.shorts)); pelvis.position.y = .02; hips.add(pelvis);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.15, 12, 10), mat(P.skin)); head.position.y = .83; hips.add(head);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(.155, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(P.cap)); cap.position.y = .85; hips.add(cap);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .02, 10), mat(P.cap)); brim.position.set(.13, .86, 0); brim.scale.set(1, 1, .9); hips.add(brim);
    const vest = new THREE.Mesh(new THREE.BoxGeometry(.12, .3, .3), mat(0x2f6b4f)); vest.position.set(-.17, .42, 0); hips.add(vest);
    const mk = (side) => {
      const z = side * .11;
      const thigh = limb(.46, .085, P.shorts); thigh.position.set(0, -.04, z); hips.add(thigh);
      const shin = limb(.44, .065, P.skin); shin.position.y = -.46; thigh.add(shin);
      const shoe = new THREE.Mesh(new THREE.BoxGeometry(.26, .09, .11), mat(P.shoe)); shoe.position.set(.06, -.46, 0); shin.add(shoe);
      const sole = new THREE.Mesh(new THREE.BoxGeometry(.27, .03, .115), mat(P.sole)); sole.position.set(.06, -.51, 0); shin.add(sole);
      const upper = limb(.3, .055, P.skin); upper.position.set(0, .62, side * .25); hips.add(upper);
      const fore = limb(.28, .048, P.skin); fore.position.y = -.3; upper.add(fore);
      return { thigh, shin, upper, fore };
    };
    parts.L = mk(1); parts.R = mk(-1); parts.hips = hips; parts.torso = torso; parts.head = head;
    hips.rotation.z = -.12; // slight forward lean (runner faces +x)
    return r;
  }
  function pine(P) {
    const g = new THREE.Group();
    const h = 1.6 + Math.random() * 1.6;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.07, .1, .5, 5), mat(P.trunk)); trunk.position.y = .25; g.add(trunk);
    for (let i = 0; i < 3; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(.75 - i * .18, h * .45, 7), mat(i % 2 ? P.pine2 : P.pine));
      cone.position.y = .5 + i * h * .22 + h * .2; g.add(cone);
    }
    return g;
  }
  function init() {
    const P = palette();
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(P.fog, 9, 30);
    camera = new THREE.PerspectiveCamera(38, 1, .1, 80);
    mats.hemi = new THREE.HemisphereLight(P.hemiSky, P.hemiGround, .95); scene.add(mats.hemi);
    mats.sun = new THREE.DirectionalLight(P.sun, .8); mats.sun.position.set(-4, 8, 6); scene.add(mats.sun);
    ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 40, 1, 1), mat(P.ground)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
    const path = new THREE.Mesh(new THREE.PlaneGeometry(120, 1.4), mat(P.path)); path.rotation.x = -Math.PI / 2; path.position.y = .01; scene.add(path);
    for (let i = 0; i < 26; i++) { // stones on the path
      const s = new THREE.Mesh(new THREE.DodecahedronGeometry(.05 + Math.random() * .06, 0), mat(0x8a8f86));
      s.position.set(-14 + Math.random() * 28, .03, (Math.random() - .5) * 1.2); scene.add(s); pathMarks.push(s);
    }
    for (let i = 0; i < 4; i++) { // distant ridges
      const m = new THREE.Mesh(new THREE.ConeGeometry(5 + Math.random() * 3, 5 + Math.random() * 4, 6), mat(P.mountain));
      m.position.set(-12 + i * 8, 1.5, -18 - Math.random() * 4); scene.add(m);
    }
    for (let i = 0; i < 22; i++) {
      const t = pine(P);
      t.position.set(-14 + Math.random() * 28, 0, -(1.7 + Math.random() * 6.5));
      t.scale.setScalar(.8 + Math.random() * .6);
      scene.add(t); trees.push(t);
    }
    const n = 420, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i * 3] = -10 + Math.random() * 20; pos[i * 3 + 1] = Math.random() * 7; pos[i * 3 + 2] = -6 + Math.random() * 10; }
    const rg = new THREE.BufferGeometry(); rg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    rain = new THREE.Points(rg, new THREE.PointsMaterial({ color: P.rain, size: .035, transparent: true, opacity: .55 }));
    scene.add(rain);
    runner = buildRunner(P); scene.add(runner);
    const myGen = ++gen;
    if (window.ZTModel) ZTModel.get().then((g) => {
      if (myGen !== gen || !scene) return;
      const clip = g.animations.find((a) => a.name === "run");
      if (!clip) return;
      scene.remove(runner);
      ZTChar.noOutline(scene);
      const toon = ZTChar.dress(g.scene, "lambert");
      effect = toon && THREE.OutlineEffect ? new THREE.OutlineEffect(renderer, { defaultThickness: .004 }) : null;
      g.scene.rotation.y = Math.PI / 2;           // the rig faces +Z; the trail runs toward +X
      runner = g.scene; scene.add(runner);
      mixer = new THREE.AnimationMixer(runner);
      mixer.clipAction(clip).play();
      if (reduceMotion) { mixer.update(.2); loop(); }
    }).catch(() => {});
    dark.addEventListener?.("change", rebuild);
    document.addEventListener("visibilitychange", () => { visible = document.visibilityState === "visible"; loop(); });
  }
  function rebuild() { const was = host; teardown(); renderer = null; init(); if (was) attach(was); }
  if (window.ZTChar) ZTChar.onChange(() => { if (renderer) rebuild(); });
  function teardown() {
    cancelAnimationFrame(raf); raf = 0;
    if (renderer) { renderer.dispose(); renderer.domElement.remove(); }
    trees = []; pathMarks = []; parts = {}; mixer = null; effect = null; gen++;
  }
  function size() {
    if (!host) return;
    const w = host.clientWidth, h = host.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  function pose(t) {
    const s = t * 9.2; // stride frequency
    for (const [k, ph] of [["L", 0], ["R", Math.PI]]) {
      const p = parts[k], a = s + ph;
      p.thigh.rotation.z = Math.sin(a) * .85;
      p.shin.rotation.z = -Math.max(0, Math.sin(a - 1.2)) * 1.5 - .15;
      p.upper.rotation.z = -Math.sin(a) * .8;
      p.fore.rotation.z = 1.35;
    }
    parts.hips.position.y = 1.0 + Math.abs(Math.sin(s)) * .07;
    parts.hips.rotation.y = Math.sin(s) * .12;
  }
  function frame(now) {
    const t = (now - t0) / 1000, dt = Math.min(.05, (now - (frame.last || now)) / 1000); frame.last = now;
    if (mixer) mixer.update(dt); else pose(t);
    const speed = 3.2 * dt;
    trees.forEach((tr) => { tr.position.x -= speed; if (tr.position.x < -14) tr.position.x += 28; });
    pathMarks.forEach((s) => { s.position.x -= speed; if (s.position.x < -14) s.position.x += 28; });
    const p = rain.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - 9 * dt, x = p.getX(i) - speed * 1.4;
      if (y < 0) y += 7; if (x < -10) x += 20;
      p.setY(i, y); p.setX(i, x);
    }
    p.needsUpdate = true;
    const sway = Math.sin(t * .25) * .9;
    camera.position.set(1.4 + sway, 1.45, 5.6);
    camera.lookAt(-1.35, 1.15, 0);
    (effect || renderer).render(scene, camera);
  }
  function loop() {
    cancelAnimationFrame(raf); raf = 0;
    if (!host || !active || !visible) return;
    if (reduceMotion) { frame(t0 + 800); return; }
    const tick = (now) => { frame(now); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  const ro = new ResizeObserver(() => { size(); if (reduceMotion) loop(); });
  const io = new IntersectionObserver((es) => { es.forEach((e) => { visible = e.isIntersecting && document.visibilityState === "visible"; }); loop(); });
  function attach(el) {
    if (!el) return;
    try { if (!renderer) init(); } catch (e) { return; }
    host = el;
    el.prepend(renderer.domElement);
    ro.disconnect(); io.disconnect(); ro.observe(el); io.observe(el);
    size(); loop();
  }
  function detach() { cancelAnimationFrame(raf); raf = 0; host = null; }
  function setActive(on) { active = on; loop(); }
  return { attach, detach, setActive };
})();
</script>

<script>
/* ================= Pengaturan: karakter, timer, pengingat ================= */
const PREFS_KEY = "zeintrail-prefs";
let prefs = { rest: 60, sound: true, voice: true };
try { const s = JSON.parse(localStorage.getItem(PREFS_KEY)); if (s) prefs = { ...prefs, ...s }; } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} };

/* Small live preview of the chosen character (only while the settings sheet is open). */
const CharPreview = (() => {
  let renderer, scene, camera, mixer, model, raf = 0, effect = null, cv = null, last = 0, gen = 0;
  function build(canvas) {
    cv = canvas;
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(30, 1, .05, 20);
    camera.position.set(1.4, 1.35, 3.2); camera.lookAt(0, .95, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5a50, .85));
    const sun = new THREE.DirectionalLight(0xfff3e0, .9); sun.position.set(2, 4, 3); scene.add(sun);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(.8, 40), new THREE.MeshStandardMaterial({ color: 0xd5e2da }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    ZTChar.noOutline(scene);
    load();
    const tick = (now) => {
      const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
      if (mixer) mixer.update(dt);
      if (model) model.rotation.y += dt * .5;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (w && h && (cv.width !== Math.round(w * renderer.getPixelRatio()))) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
      (effect || renderer).render(scene, camera);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function load() {
    const my = ++gen;
    ZTModel.get().then((g) => {
      if (my !== gen || !scene) return;
      if (model) scene.remove(model);
      model = g.scene;
      const toon = ZTChar.dress(model, "standard");
      effect = toon && THREE.OutlineEffect ? new THREE.OutlineEffect(renderer, { defaultThickness: .005 }) : null;
      scene.add(model);
      mixer = new THREE.AnimationMixer(model);
      const clip = g.animations.find((a) => a.name === (reduceMotion ? "idle" : "run")) || g.animations[0];
      mixer.clipAction(clip).play();
      if (reduceMotion) mixer.update(.3);
    }).catch(() => {});
  }
  function dispose() { cancelAnimationFrame(raf); raf = 0; gen++; if (renderer) renderer.dispose(); renderer = scene = model = mixer = effect = null; }
  return { build, reload: () => { if (scene) load(); }, dispose };
})();
ZTChar.onChange(() => CharPreview.reload());

function swatches(list, cur, key) {
  return `<div class="swatches" role="radiogroup">${list.map((c) => `<button type="button" class="sw" role="radio" aria-checked="${c === cur}" aria-label="${c}" data-k="${key}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>`;
}
function settingsHTML() {

    `<button type="button" class="char-card" role="radio" aria-checked="${sv.pick === id}" data-char="${id}"><b>${p.name}</b><span>${p.desc}</span></button>`).join("");
  const acc = [["face", "Wajah anime"], ["headband", "Ikat kepala"], ["cap", "Topi trucker"], ["glasses", "Kacamata"], ["buff", "Buff leher"], ["vest", "Rompi hidrasi"], ["poles", "Tongkat trail"]];
  return `

      ${sv.pick === "custom" ? `
      <div class="custom">
        <div class="field"><span class="lbl">Aksesoris</span>
          <div class="chips">${acc.map(([k, l]) => `<button type="button" class="chip-q tog" aria-pressed="${!!c[k]}" data-acc="${k}">${l}</button>`).join("")}</div></div>
        <div class="field"><span class="lbl">Rambut</span>
          <div class="chips">${[["none", "Tanpa rambut"], ["short", "Pendek"], ["spiky", "Berantakan"]].map(([k, l]) => `<button type="button" class="chip-q tog" aria-pressed="${c.hair === k}" data-hair="${k}">${l}</button>`).join("")}</div>
          ${swatches(ZTChar.HAIRS, c.hairColor, "hairColor")}</div>
        <div class="field"><span class="lbl">Warna kulit</span>${swatches(ZTChar.SKINS, c.skin, "skin")}</div>
        <div class="field"><span class="lbl">Kaus</span>${swatches(ZTChar.SHIRTS, c.shirt, "shirt")}</div>
        <div class="field"><span class="lbl">Celana</span>${swatches(ZTChar.SHORTS, c.shorts, "shorts")}</div>
        <div class="field"><span class="lbl">Sepatu</span>${swatches(["#f3f6f4", "#3b3f3d", "#f0a43a", "#3f97be", "#d4472a"], c.shoes, "shoes")}</div>
      </div>` : ""}
    </div>
    <div class="card">
      <h3>Latihan terpandu</h3>
      <div class="field"><span class="lbl">Istirahat antar set</span>
        <div class="chips">${[45, 60, 90].map((n) => `<button type="button" class="chip-q tog" aria-pressed="${prefs.rest === n}" data-rest="${n}">${n} detik</button>`).join("")}</div></div>
      <label class="switch"><input type="checkbox" id="pf-sound" ${prefs.sound ? "checked" : ""}><span>Bunyi saat timer habis</span></label>
      <label class="switch"><input type="checkbox" id="pf-voice" ${prefs.voice ? "checked" : ""}><span>Panduan suara saat lari mengikuti rute</span></label>
    </div>
    <div class="card"><h3>Pengingat latihan</h3><button type="button" class="btn" id="open-remind">Atur pengingat</button></div>`;
}
function openSettings() {
  openSheet(settingsHTML(), "Pengaturan", (inner, close) => {
    CharPreview.build(inner.querySelector("#char-canvas"));
    const reopen = () => { const y = inner.closest(".sheet").scrollTop; CharPreview.dispose(); close(); openSettings(); requestAnimationFrame(() => { const sh = document.querySelector(".sheet"); if (sh) sh.scrollTop = y; }); };
    inner.querySelectorAll("[data-char]").forEach((b) => b.addEventListener("click", () => { ZTChar.pick(b.dataset.char); reopen(); }));
    inner.querySelectorAll("[data-acc]").forEach((b) => b.addEventListener("click", () => {
      const k = b.dataset.acc, v = !ZTChar.saved.custom[k]; b.setAttribute("aria-pressed", String(v)); ZTChar.setCustom({ [k]: v });
    }));
    inner.querySelectorAll("[data-hair]").forEach((b) => b.addEventListener("click", () => {

    }));
    inner.querySelectorAll(".sw").forEach((b) => b.addEventListener("click", () => {
      inner.querySelectorAll(`.sw[data-k="${b.dataset.k}"]`).forEach((x) => x.setAttribute("aria-checked", String(x === b))); ZTChar.setCustom({ [b.dataset.k]: b.dataset.c });
    }));
    inner.querySelectorAll("[data-rest]").forEach((b) => b.addEventListener("click", () => {
      prefs.rest = Number(b.dataset.rest); savePrefs(); inner.querySelectorAll("[data-rest]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    }));
    inner.querySelector("#pf-sound").addEventListener("change", (e) => { prefs.sound = e.target.checked; savePrefs(); });
    inner.querySelector("#pf-voice").addEventListener("change", (e) => { prefs.voice = e.target.checked; savePrefs(); });
    inner.querySelector("#open-remind").addEventListener("click", () => { CharPreview.dispose(); close(); openReminders(); });
  }, () => CharPreview.dispose());
}
document.getElementById("settings-btn").addEventListener("click", openSettings);
</script>

<script>
/* ================= Movement animations (2D) ================= */
const LEN = { torso: 50, thigh: 42, shin: 42, ua: 28, fa: 26, foot: 14, head: 9 };
const GROUND = 188, SW = 240, SH = 215;
const rad = (d) => d * Math.PI / 180;
const dn = (a, l) => [Math.sin(rad(a)) * l, Math.cos(rad(a)) * l];
const add2 = (p, v) => [p[0] + v[0], p[1] + v[1]];
const MOVES = [
  { name: "Squat", dose: "3 × 12", view: "tampak samping", anchor: "ankle0", ax: 118,
    K: { a: { t: 4, l: [[0,0,0],[0,0,0]], a: [[6,6],[6,6]] }, b: { t: 40, l: [[80,-28,0],[80,-28,0]], a: [[85,90],[85,90]] } },
    seq: [["a",0,.5],["b",1.4,.4],["a",1.2,0]],

    // turns ahead
    for (const t of run.cues.turns) {
      const ahead = t.d - along;
      if (!t.said && ahead > 0 && ahead <= 70) {
        t.said = true;
        const dir = t.t > 0 ? "kanan" : "kiri", sharp = Math.abs(t.t) > 110 ? " tajam" : "";
        cue(`Dalam ${Math.max(10, Math.round(ahead / 10) * 10)} meter, belok ${dir}${sharp}.`);
        break;
      }
      if (ahead < -20) t.said = true;
    }
    // climbs ahead
    for (const c2 of run.cues.climbs) {
      const ahead = c2.d - along;
      if (!c2.said && ahead > 0 && ahead <= 200) {
        c2.said = true;
        cue(`Tanjakan di depan. Naik sekitar ${c2.up} meter sepanjang ${c2.len >= 1000 ? spokenKm(c2.len) : Math.round(c2.len / 10) * 10 + " meter"}. Siapkan power hiking.`);
      }
      if (ahead < -50) c2.said = true;
    }
  }
  kmCue(r, along);
  // finish
  if (!run.finished && hav(p, r.pts[r.pts.length - 1]) < 35 && along > r.dist * .85) {
    run.finished = true;
    cue(`Selamat, kamu sampai finish! Total ${spokenKm(run.dist)} dalam ${spokenTime(elapsed())}.`);
    Sound.done();
  }
  updateRunUI();
}
function kmCue(r, along) {
  if (run.dist < run.nextKm) return;
  const t = elapsed(), splitSec = (Date.now() - run.lastSplitT) / 1000;
  run.splits.push(splitSec); run.lastSplitT = Date.now();
  const km = Math.round(run.nextKm / 1000);
  cue(`Kilometer ${km}. Waktu ${spokenTime(t)}. Pace kilometer terakhir ${spokenTime(splitSec)}.` + (r ? ` Sisa rute ${spokenKm(Math.max(0, r.dist - along))}.` : ""));
  run.nextKm += 1000;
}
function updateRunUI() {
  if (!run) return;
  const r = run.r, t = elapsed();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set("run-time", hms(t));
  set("run-dist", fmtKm(run.dist));
  // pace over the last ~500 m of track
  let pace = NaN;
  for (let i = run.track.length - 1, d = 0; i > 0; i--) {
    d += hav(run.track[i - 1], run.track[i]);
    if (d >= 400) { pace = (run.track[run.track.length - 1][3] - run.track[i - 1][3]) / 1000 / (d / 1000); break; }
  }
  if (!Number.isFinite(pace) && run.dist > 200) pace = t / (run.dist / 1000);
  set("run-pace", paceStr(pace));
  if (r) { set("run-prog", fmtKm(r.cum[run.idx])); if (r.hasEle) set("run-up", String(Math.round(r.climbAfter[run.idx]))); }
  else { set("run-avg", run.dist > 200 ? paceStr(t / (run.dist / 1000)) : "–"); set("run-gain", String(Math.round(run.gain))); }
}
function toRunGPX() {
  const pts = run.track.map((p) => `<trkpt lat="${p[0].toFixed(6)}" lon="${p[1].toFixed(6)}">${p[2] != null ? `<ele>${p[2].toFixed(1)}</ele>` : ""}<time>${new Date(p[3]).toISOString()}</time></trkpt>`).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Zein Trail" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>Lari ${TODAY}</name><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>\n`;
}
function finishRun() {
  if (!run) return;
  navigator.geolocation.clearWatch(run.watch); clearInterval(run.ui);
  if (run.pausedAt) { run.pauseTotal += Date.now() - run.pausedAt; run.pausedAt = 0; }
  const t = elapsed(), km = Math.round(run.dist / 100) / 10;
  Voice.say(`Lari selesai. ${spokenKm(run.dist)} dalam ${spokenTime(t)}.`, true);
  const day = BYKEY[TODAY];
  const canLog = day && day.type !== "rest" && day.type !== "str" && km >= .3;
  const wrap = document.querySelector(".runmode");
  if (run.dist >= 100 && run.track.length > 1) saveRunHistory(t);
  const splits = run.splits.length ? `<ol class="splits">${run.splits.map((sec, i) => `<li><span>Km ${i + 1}</span><b>${paceStr(sec)}</b></li>`).join("")}</ol>` : "";
  wrap.querySelector(".run-grid").insertAdjacentHTML("beforebegin", `<div class="card"><h3>Lari selesai</h3>
    <p style="margin:0">${fmtKm(run.dist)} km dalam ${hms(t)}${run.dist > 200 ? `, pace rata-rata ${paceStr(t / (run.dist / 1000))} per km` : ""}${run.gain >= 5 ? `, naik ${Math.round(run.gain)} m` : ""}. Tersimpan di riwayat lari.</p>${splits}
    <div class="btns">${canLog ? `<button type="button" class="btn primary" id="run-log">Catat ke sesi hari ini (${String(km).replace(".", ",")} km)</button>` : ""}
      ${run.track.length > 1 ? `<button type="button" class="btn" id="run-gpx">Simpan rekaman GPX</button>` : ""}
      <button type="button" class="btn" id="run-close">Tutup</button></div></div>`);
  wrap.querySelector(".ses-ctl").remove();
  wrap.querySelector("#run-cue").remove();
  wrap.querySelector("#run-log")?.addEventListener("click", (e) => {
    setEntry(day.key, { done: true, km }); renderAll(); celebrate(e.currentTarget); toast("Tercatat di sesi hari ini");
    e.currentTarget.disabled = true; e.currentTarget.textContent = "Sudah dicatat";
  });
  const gpxText = toRunGPX();
  wrap.querySelector("#run-gpx")?.addEventListener("click", () => downloadFile(`lari-${TODAY}.gpx`, gpxText, "application/gpx+xml"));
  wrap.querySelector("#run-close").addEventListener("click", closeRun);
}
function closeRun() {
  if (!run) return;
  navigator.geolocation.clearWatch(run.watch); clearInterval(run.ui);
  keepAwake(false); Voice.cancel();
  document.removeEventListener("visibilitychange", onRunVisible);
  const mapEl = document.getElementById("map");
  const slotHome = document.querySelector("#v-route .btns.map-actions");
  if (mapEl && slotHome) slotHome.parentElement.insertBefore(mapEl, slotHome);
  if (meMarker && lmap && !run.ownMap) lmap.removeLayer(meMarker);
  meMarker = null;
  if (run.ownMap) run.ownMap.remove();
  document.querySelector(".runmode")?.remove();
  document.body.style.overflow = "";
  run = null;
  setTimeout(() => { if (lmap) { lmap.invalidateSize(); fitRoute(); } }, 60);
  renderRunHistory();
}

/* ================= Riwayat lari ================= */
function saveRunHistory(t) {
  let pts = run.track.map((p) => [+p[0].toFixed(6), +p[1].toFixed(6), p[2] != null ? Math.round(p[2] * 10) / 10 : null, p[3]]);
  const step = Math.ceil(pts.length / 3000); if (step > 1) pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  const item = { id: "run" + Date.now().toString(36), date: new Date(run.startT).toISOString(), day: TODAY, dist: run.dist, time: t, gain: run.gain,
    splits: run.splits, route: run.r ? run.r.name : null, pts };
  RunDB.put(item).then(renderRunHistory).catch(() => toast("Riwayat lari gagal disimpan"));
}
async function renderRunHistory() {
  const box = document.getElementById("run-history"); if (!box) return;
  let list = [];
  try { list = (await RunDB.all()).sort((a, b) => a.date < b.date ? 1 : -1); } catch (e) {}
  if (!list.length) { box.innerHTML = `<h3>Riwayat lari</h3><p class="muted" style="margin:0">Belum ada lari yang direkam. Ketuk <b>Lari bebas</b> untuk mulai merekam rute dan pace-mu.</p>`; return; }
  box.innerHTML = `<h3>Riwayat lari</h3><ul class="runs">${list.slice(0, 30).map((x) => {
    const d = new Date(x.date);
    return `<li><div><b>${fmtKm(x.dist)} km</b><span>${DOWL[(d.getDay() + 6) % 7]} ${fmt(d)}, ${hms(x.time)}, pace ${paceStr(x.time / (x.dist / 1000))}${x.gain >= 5 ? `, naik ${Math.round(x.gain)} m` : ""}${x.route ? `<br>Rute: ${esc(x.route)}` : ""}</span></div>
      <div class="btns"><button type="button" class="btn" data-run-route="${x.id}">Jadikan rute</button><button type="button" class="btn" data-run-gpx="${x.id}">GPX</button><button type="button" class="btn ghost" data-run-del="${x.id}" aria-label="Hapus">Hapus</button></div></li>`;
  }).join("")}</ul>`;
  const byId = (id) => list.find((x) => x.id === id);
  box.querySelectorAll("[data-run-route]").forEach((b) => b.addEventListener("click", async () => {
    const x = byId(b.dataset.runRoute); const d = new Date(x.date);
    const route = { id: "r" + Date.now().toString(36), name: `Lari ${fmt(d)} (${fmtKm(x.dist)} km)`, pts: x.pts.map((p) => [p[0], p[1], p[2]]), added: new Date().toISOString() };
    await RouteDB.put(route); try { localStorage.setItem(ACTIVE_KEY, route.id); } catch (e) {}
    await loadRoutes(); toast("Disimpan sebagai rute"); window.scrollTo(0, 0);
  }));
  box.querySelectorAll("[data-run-gpx]").forEach((b) => b.addEventListener("click", () => {
    const x = byId(b.dataset.runGpx);
    const pts = x.pts.map((p) => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[2] != null ? `<ele>${p[2]}</ele>` : ""}${p[3] ? `<time>${new Date(p[3]).toISOString()}</time>` : ""}</trkpt>`).join("\n");
    downloadFile(`lari-${x.day}.gpx`, `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Zein Trail" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>Lari ${x.day}</name><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>\n`, "application/gpx+xml");
  }));
  box.querySelectorAll("[data-run-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!b.classList.contains("armed")) { b.classList.add("armed", "danger"); b.textContent = "Yakin?"; setTimeout(() => { b.classList.remove("armed", "danger"); b.textContent = "Hapus"; }, 4000); return; }
    await RunDB.del(b.dataset.runDel).catch(() => {}); renderRunHistory();
  }));
}
</script>
<script>
/* ================= Buat rute di sekitar lokasi =================
   Auto loop of a chosen length from where you stand, or tap-to-draw.
   Paths follow trails/roads through the free BRouter service when it is reachable;
   otherwise the points are joined with straight lines. */
let bld = null;
function destPoint(p, brngDeg, dist) {
  const R = 6371000, d = dist / R, b = brngDeg * Math.PI / 180, la = p[0] * Math.PI / 180, lo = p[1] * Math.PI / 180;
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
  const lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return [la2 * 180 / Math.PI, lo2 * 180 / Math.PI];
}
async function routeVia(points, follow) {
  if (points.length < 2) return { pts: points.map((p) => [p[0], p[1], null]), snapped: false };
  if (follow && navigator.onLine) {
    try {
      const url = `https://brouter.de/brouter?lonlats=${points.map((p) => p[1].toFixed(6) + "," + p[0].toFixed(6)).join("|")}&profile=hiking-mountain&alternativeidx=0&format=geojson`;
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
      const res = await fetch(url, { signal: ctl.signal }); clearTimeout(to);
      if (res.ok) {
        const gj = await res.json();
        const coords = gj.features && gj.features[0] && gj.features[0].geometry.coordinates;
        if (coords && coords.length > 1) return { pts: coords.map((c) => [+c[1].toFixed(6), +c[0].toFixed(6), c[2] != null ? Math.round(c[2] * 10) / 10 : null]), snapped: true };
      }
    } catch (e) {}
  }
  return { pts: points.map((p) => [p[0], p[1], null]), snapped: false };
}
function openBuilder() {
  if (!window.L) { toast("Peta belum bisa dimuat"); return; }
  bld = { mode: "auto", km: 5, follow: true, start: null, pts: [], route: null, seed: Math.random() * 360, busy: false, map: null, layer: null, marks: null };
  const wrap = document.createElement("div");
  wrap.className = "session builder"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true"); wrap.setAttribute("aria-label", "Buat rute");
  wrap.innerHTML = `
    <div class="ses-top"><button type="button" class="btn ghost" id="b-close">Batal</button><b style="flex:1">Buat rute</b><span id="b-gps">Mencari lokasimu…</span></div>
    <div class="seg" role="tablist"><button type="button" role="tab" data-bmode="auto" aria-selected="true">Putaran otomatis</button><button type="button" role="tab" data-bmode="draw" aria-selected="false">Gambar sendiri</button></div>
    <div class="map" id="b-map"></div>
    <div id="b-panel"></div>
    <div class="stats4" id="b-stats"></div>
    <div class="card"><div class="field"><label for="b-name">Nama rute</label><input id="b-name" maxlength="60" placeholder="Contoh: Putaran 5 km dekat rumah"></div>
      <button type="button" class="btn primary" id="b-save" disabled>Simpan rute</button></div>`;
  document.body.appendChild(wrap); document.body.style.overflow = "hidden";
  bld.map = L.map("b-map", { zoomControl: true });
  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, subdomains: "abc",
    attribution: 'Peta: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, SRTM | Gaya: © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a>' }).addTo(bld.map);
  bld.map.setView([-7.88, 112.52], 14);
  bld.layer = L.polyline([], { color: "#f0a43a", weight: 5 }).addTo(bld.map);
  bld.marks = L.layerGroup().addTo(bld.map);
  bld.map.on("click", (e) => { if (bld.mode !== "draw") return; addDrawPoint([e.latlng.lat, e.latlng.lng]); });
  wrap.querySelector("#b-close").addEventListener("click", closeBuilder);
  wrap.querySelectorAll("[data-bmode]").forEach((b) => b.addEventListener("click", () => {
    bld.mode = b.dataset.bmode; wrap.querySelectorAll("[data-bmode]").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    bld.pts = bld.start ? [bld.start] : []; bld.route = null; drawBuilder(); renderBuilderPanel();
  }));
  wrap.querySelector("#b-save").addEventListener("click", saveBuilt);
  renderBuilderPanel();
  navigator.geolocation.getCurrentPosition((pos) => {
    bld.start = [pos.coords.latitude, pos.coords.longitude];
    document.getElementById("b-gps").textContent = `Lokasimu ±${Math.round(pos.coords.accuracy)} m`;
    bld.map.setView(bld.start, 15);
    L.circleMarker(bld.start, { radius: 8, color: "#fff", weight: 3, fillColor: "#3f97be", fillOpacity: 1 }).bindTooltip("Kamu di sini").addTo(bld.map);
    if (bld.mode === "draw" && !bld.pts.length) bld.pts = [bld.start];
    renderBuilderPanel();
  }, () => {
    document.getElementById("b-gps").textContent = "Lokasi tidak didapat";
    toast("Lokasi tidak didapat. Ketuk peta untuk menentukan titik start.");
    bld.mode = "draw"; wrap.querySelectorAll("[data-bmode]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.bmode === "draw")));
    renderBuilderPanel();
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
  setTimeout(() => bld && bld.map.invalidateSize(), 80);
}
function renderBuilderPanel() {
  const p = document.getElementById("b-panel"); if (!p) return;
  if (bld.mode === "auto") {
    p.innerHTML = `<div class="card"><div class="field"><span class="lbl">Panjang putaran dari lokasimu</span>
      <div class="chips">${[3, 5, 8, 10, 16].map((k) => `<button type="button" class="chip-q tog" data-bkm="${k}" aria-pressed="${bld.km === k}">${k} km</button>`).join("")}</div></div>
      <label class="switch"><input type="checkbox" id="b-follow" ${bld.follow ? "checked" : ""}><span>Ikuti jalan dan jalur setapak (butuh internet)</span></label>
      <div class="btns"><button type="button" class="btn amber" id="b-gen" ${bld.start && !bld.busy ? "" : "disabled"}>${bld.busy ? "Membuat rute…" : bld.route ? "Buat versi lain" : "Buat putaran"}</button></div></div>`;
    p.querySelectorAll("[data-bkm]").forEach((b) => b.addEventListener("click", () => { bld.km = Number(b.dataset.bkm); renderBuilderPanel(); }));
    p.querySelector("#b-gen").addEventListener("click", () => { if (bld.route) bld.seed += 75 + Math.random() * 60; generateLoop(); });
  } else {
    p.innerHTML = `<div class="card"><p style="margin:0;font-size:15px">Ketuk peta untuk menambah titik, mulai dari lokasimu. Garis akan mengikuti jalan atau jalur setapak di antara titik.</p>
      <label class="switch"><input type="checkbox" id="b-follow" ${bld.follow ? "checked" : ""}><span>Ikuti jalan dan jalur setapak (butuh internet)</span></label>
      <div class="btns"><button type="button" class="btn" id="b-undo" ${bld.pts.length > 1 ? "" : "disabled"}>Hapus titik terakhir</button>
      <button type="button" class="btn" id="b-loop" ${bld.pts.length > 2 ? "" : "disabled"}>Kembali ke start</button></div></div>`;
    p.querySelector("#b-undo").addEventListener("click", () => { bld.pts.pop(); rebuildDraw(); });
    p.querySelector("#b-loop").addEventListener("click", () => addDrawPoint(bld.pts[0]));
  }
  p.querySelector("#b-follow").addEventListener("change", (e) => { bld.follow = e.target.checked; if (bld.mode === "draw") rebuildDraw(); });
}
async function generateLoop() {
  if (!bld.start || bld.busy) return;
  bld.busy = true; renderBuilderPanel();
  const target = bld.km * 1000;
  let factor = bld.follow ? .72 : 1, out = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    const R = target / (2 * Math.PI) * factor;
    const c = destPoint(bld.start, bld.seed, R);
    const way = [bld.start, destPoint(c, bld.seed + 270, R), destPoint(c, bld.seed, R), destPoint(c, bld.seed + 90, R), bld.start];
    out = await routeVia(way, bld.follow);
    if (!bld) return;
    const d = enrich({ pts: out.pts }).dist;
    if (Math.abs(d - target) / target < .15 || !out.snapped) break;
    factor *= target / d;
  }
  bld.busy = false;
  if (!out.snapped && bld.follow) toast("Layanan jalur tidak terhubung. Rute dibuat garis lurus.");
  bld.route = out.pts; drawBuilder(); renderBuilderPanel();
}
async function addDrawPoint(pt) {
  bld.pts.push(pt);
  L.circleMarker(pt, { radius: 5, color: "#fff", weight: 2, fillColor: "#163d2e", fillOpacity: 1 }).addTo(bld.marks);
  await rebuildDraw();
}
let drawGen = 0;
async function rebuildDraw() {
  const my = ++drawGen;
  bld.marks.clearLayers();
  bld.pts.forEach((pt) => L.circleMarker(pt, { radius: 5, color: "#fff", weight: 2, fillColor: "#163d2e", fillOpacity: 1 }).addTo(bld.marks));
  if (bld.pts.length < 2) { bld.route = null; drawBuilder(); renderBuilderPanel(); return; }
  const out = await routeVia(bld.pts, bld.follow);
  if (!bld || my !== drawGen) return;
  bld.route = out.pts; drawBuilder(); renderBuilderPanel();
}
function drawBuilder() {
  const pts = bld.route || [];
  bld.layer.setLatLngs(pts.map((p) => [p[0], p[1]]));
  const st = document.getElementById("b-stats"), save = document.getElementById("b-save");
  if (pts.length > 1) {
    const r = enrich({ pts });
    st.innerHTML = `<div><b>${fmtKm(r.dist)} km</b><span>jarak</span></div><div><b>${r.hasEle ? "+" + Math.round(r.gain) : "–"} m</b><span>total naik</span></div>
      <div><b>${r.hasEle ? "−" + Math.round(r.loss) : "–"} m</b><span>total turun</span></div><div><b>${r.hasEle ? Math.round(r.maxE) : "–"} m</b><span>titik tertinggi</span></div>`;
    if (bld.mode === "auto") bld.map.fitBounds(pts.map((p) => [p[0], p[1]]), { padding: [20, 20] });
    save.disabled = false;
    const nm = document.getElementById("b-name"); if (!nm.value) nm.placeholder = `Putaran ${fmtKm(r.dist)} km`;
  } else { st.innerHTML = ""; save.disabled = true; }
}
async function saveBuilt() {
  if (!bld.route || bld.route.length < 2) return;
  const name = document.getElementById("b-name").value.trim() || document.getElementById("b-name").placeholder.replace(/^Contoh: /, "");
  const route = { id: "r" + Date.now().toString(36), name: name.slice(0, 60), pts: bld.route, added: new Date().toISOString() };
  await RouteDB.put(route); try { localStorage.setItem(ACTIVE_KEY, route.id); } catch (e) {}
  closeBuilder(); await loadRoutes(); toast("Rute disimpan");
}
renderRunHistory();
function closeBuilder() {
  if (!bld) return;
  bld.map.remove(); bld = null;
  document.querySelector(".builder")?.remove(); document.body.style.overflow = "";
}
</script>
