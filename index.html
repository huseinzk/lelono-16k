<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zein Trail</title>
<meta name="description" content="Zein Trail Program: latihan 15 minggu menuju Lelono 16K, dengan catatan progres.">
<meta name="theme-color" content="#163d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zein Trail">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept: dawn in a wet pine forest. Deep forest ink, mist surfaces, one amber "headlamp" accent.
   Layout: compact header → living 3D trail window as the hero → stacked content → floating pill tab bar. */
:root {
  --bg: #edf3ef; --surface: #ffffff; --surface-2: #f5f9f6; --ink: #10261d; --muted: #587066; --line: #d5e2da;
  --forest: #163d2e; --moss: #2f6b4f; --moss-ink: #ffffff; --dawn: #f0a43a; --dawn-ink: #3b2300; --water: #3f97be;
  --easy: #dcefe3; --easy-fg: #1f5a3e; --hill: #fbe7c6; --hill-fg: #7a4a0b; --long: #d5ebf3; --long-fg: #134d63;
  --str: #e7e2f5; --str-fg: #4a3b80; --rest: #e9eeeb; --rest-fg: #62736b; --race: #d4472a; --race-fg: #ffffff;
  --sky-top: #f6d6a3; --sky-mid: #b9d6c9; --sky-low: #6f9e86; --scrim: rgba(8, 20, 14, .48);
  --figure: #10261d; --figure-far: #9db1a6; --shadow: 0 1px 2px rgba(16, 38, 29, .06), 0 8px 24px rgba(16, 38, 29, .07);
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0c1813; --surface: #13231b; --surface-2: #182b22; --ink: #e5efe9; --muted: #93a99d; --line: #23372c;
  --forest: #0a1510; --moss: #69c094; --moss-ink: #08160f; --dawn: #f3b052; --dawn-ink: #2a1800; --water: #6cc0e3;
  --easy: #193a2a; --easy-fg: #a3dcbd; --hill: #3b2c13; --hill-fg: #f3c77f; --long: #133442; --long-fg: #9fd5ea;
  --str: #272241; --str-fg: #c8bdf3; --rest: #18241e; --rest-fg: #869a90; --race: #ec6644; --race-fg: #1a0a05;
  --sky-top: #1d2c45; --sky-mid: #1d3b3a; --sky-low: #10291e; --scrim: rgba(0, 0, 0, .6);
  --figure: #e5efe9; --figure-far: #4f655a; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25);
  color-scheme: dark; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--moss); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--dawn); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Header ---------- */
.top { position: sticky; top: 0; z-index: 40; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); transform: translateZ(0); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.brand { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--forest); display: grid; place-items: center; flex: none; }
.mark svg { width: 22px; height: 22px; }
.brand b { font: 800 21px/1 var(--font-display); font-stretch: 85%; letter-spacing: -.01em; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.pill-count { display: flex; align-items: baseline; gap: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; white-space: nowrap; }
.pill-count b { font: 800 19px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pill-count span { font-size: 12px; color: var(--muted); font-weight: 600; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; position: relative; }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--dawn); }
.install { border: 0; border-radius: 99px; background: var(--dawn); color: var(--dawn-ink); font-weight: 700; padding: 8px 12px; font-size: 13px; }

main { position: relative; z-index: 0; max-width: 560px; margin: 0 auto; padding: 4px 16px calc(env(safe-area-inset-bottom, 0px) + 120px); }
.view { display: grid; gap: 14px; }
.view.enter { animation: viewIn .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
h2 { font: 800 30px/1.05 var(--font-display); font-stretch: 85%; letter-spacing: -.015em; margin: 6px 0 0; text-wrap: balance; }
h3 { font: 700 20px/1.15 var(--font-display); font-stretch: 90%; margin: 0; }
.lede { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }

/* ---------- Type colours & badges ---------- */
.t-easy { background: var(--easy); color: var(--easy-fg); }
.t-hill { background: var(--hill); color: var(--hill-fg); }
.t-long { background: var(--long); color: var(--long-fg); }
.t-str  { background: var(--str);  color: var(--str-fg); }
.t-rest { background: var(--rest); color: var(--rest-fg); }
.t-race { background: var(--race); color: var(--race-fg); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 5px 11px 5px 8px; border-radius: 99px; }
.badge svg { width: 16px; height: 16px; }
.tico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.tico svg { width: 22px; height: 22px; }

/* ---------- Hero: 3D trail window ---------- */
.hero { position: relative; border-radius: 26px; overflow: hidden; min-height: 330px; display: grid; align-content: end;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-low) 100%); isolation: isolate; box-shadow: var(--shadow); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent 38%, rgba(6, 18, 12, .78) 100%); }
.hero-body { padding: 18px; color: #f3f8f4; display: grid; gap: 6px; }
.hero-when { font-size: 14px; font-weight: 600; opacity: .9; }
.hero-what { max-width: 9ch; font: 800 42px/.98 var(--font-display); font-stretch: 80%; letter-spacing: -.02em; text-wrap: balance; }
.hero-note { font-size: 15.5px; opacity: .92; max-width: 26ch; }
.hero .badge { justify-self: start; }
.hero-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.hero-stats span { background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .22); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 600; }
.hero.done .hero-what::after { content: " ✓"; color: var(--dawn); }

/* ---------- Buttons & form ---------- */
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-md); padding: 12px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--moss); color: var(--moss-ink); border-color: transparent; }
.btn.amber { background: var(--dawn); color: var(--dawn-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--race); border-color: color-mix(in srgb, var(--race) 50%, transparent); background: transparent; }
.btn.danger.armed { background: var(--race); color: var(--race-fg); }
.btn[disabled] { opacity: .5; cursor: default; }
@media (prefers-reduced-motion: no-preference) { .btn, .row, .sd, .chip-q, .tab { transition: transform .12s ease, background-color .2s, color .2s; } .btn:active, .row:active, .sd:active, .chip-q:active { transform: scale(.97); } }
.done-btn { width: 100%; border: 2px solid var(--moss); background: transparent; color: var(--moss); border-radius: 16px; padding: 15px; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; }
.done-btn .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; }
.done-btn .ck svg { width: 16px; height: 16px; stroke-width: 3; stroke-dasharray: 24; stroke-dashoffset: 24; }
.done-btn[aria-pressed="true"] { background: var(--moss); color: var(--moss-ink); }
.done-btn[aria-pressed="true"] .ck { background: var(--moss-ink); color: var(--moss); border-color: var(--moss-ink); }
.done-btn[aria-pressed="true"] .ck svg { stroke-dashoffset: 0; transition: stroke-dashoffset .35s .05s ease-out; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 700; font-size: 14px; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 76px; resize: vertical; }
.rpe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rpe button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 2px; font-size: 11.5px; line-height: 1.15; font-weight: 600; }
.rpe button b { display: block; font: 800 20px var(--font-display); }
.rpe button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.saved { font-size: 13px; color: var(--muted); min-height: 1em; }
.extra { display: grid; gap: 8px; }
.extra b { font-weight: 700; }
.extra ul, .extra ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--moss); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }

/* ---------- Week strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sd { border: 0; border-radius: 14px; padding: 7px 2px 8px; display: grid; justify-items: center; gap: 3px; min-width: 0; }
.sd .d { font-size: 11px; font-weight: 700; opacity: .8; }
.sd .n { font: 800 20px/1 var(--font-display); }
.sd svg { width: 15px; height: 15px; }
.sd .m { height: 15px; display: grid; place-items: center; }
.sd.today { box-shadow: 0 0 0 2px var(--ink); }
.sd.is-done .m { color: inherit; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

/* ---------- Calendar ---------- */
.phase-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }
.phase-h h2 { font-size: 26px; }
.week-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 13.5px; color: var(--muted); padding: 10px 4px 6px; }
.week-h b { color: var(--ink); font: 700 17px var(--font-display); }
.days { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; border: 0; border-radius: 16px; padding: 10px 12px; text-align: left; width: 100%; }
.row .tt { font-weight: 700; font-size: 15px; line-height: 1.2; }
.row .nt { font-size: 13px; opacity: .85; }
.row .dt { font-size: 12px; font-weight: 700; opacity: .75; }
.row .tico { width: 40px; height: 40px; background: rgba(255, 255, 255, .45); }
.row.today { box-shadow: 0 0 0 2px var(--ink); }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; opacity: .55; }
.tick svg { width: 14px; height: 14px; stroke-width: 3; }
.row.done .tick { background: currentColor; opacity: 1; }
.row.done .tick svg { stroke: var(--surface); }
.row.done .tt { text-decoration: line-through; text-decoration-thickness: 2px; }
.row.missed .tick { border-style: dashed; }
.week-block { scroll-margin-top: 80px; }

/* ---------- Progress ---------- */
.ring-wrap { display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 132px; height: 132px; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--moss); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font: 800 30px/1 var(--font-display); }
.ring .lbl span { font-size: 12px; color: var(--muted); font-weight: 600; }
.kv { display: grid; gap: 10px; }
.kv div b { display: block; font: 800 24px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.kv div span { font-size: 13px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 600 9px var(--font-body); }
.chart .cur { fill: var(--ink); font-weight: 800; }
.bar-plan { fill: var(--line); }
.bar-done { fill: var(--moss); }
.grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.logs { display: grid; margin: 0; padding: 0; list-style: none; }
.logs li { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.logs li:last-child { border-bottom: 0; }
.logs li small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Moves ---------- */
.move { padding: 0; overflow: hidden; gap: 0; }
.stage { position: relative; background: var(--surface-2); }
.stage canvas { display: block; width: 100%; aspect-ratio: 240 / 215; }
.stage .play { position: absolute; right: 12px; bottom: 12px; font-weight: 700; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px; }
.stage .vw { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: var(--muted); font-weight: 600; }
.move-b { padding: 16px 18px 18px; display: grid; gap: 10px; }
.move-b ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.avoid { margin: 0; padding: 9px 12px; border-radius: 12px; font-size: 14px; }

.viewer { position: relative; border-radius: 26px; overflow: hidden; background: radial-gradient(120% 90% at 50% 10%, var(--surface) 0%, var(--surface-2) 60%, var(--line) 100%); box-shadow: var(--shadow); touch-action: pan-y; }
.viewer canvas { display: block; width: 100%; aspect-ratio: 1 / 1; max-height: 62vh; cursor: grab; }
.viewer-ui { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
.viewer-ui > * { pointer-events: auto; }
.viewer-hint { font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--surface); border-radius: 99px; padding: 4px 10px; }
.viewer .play { font-weight: 700; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; }
.hold-tag { position: absolute; top: 14px; left: 14px; background: var(--dawn); color: var(--dawn-ink); font-weight: 800; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.move-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
.move-chips::-webkit-scrollbar { display: none; }
.move-chip { flex: none; scroll-snap-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.move-chip svg { width: 16px; height: 16px; }
.move-chip[aria-selected="true"] { background: var(--forest); color: #eef6f1; border-color: transparent; }
#move-detail ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }

/* ---------- Route ---------- */
.map { height: 360px; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: var(--surface-2); z-index: 0; position: relative; }
.map .leaflet-control-attribution { font-size: 10px; }
.route-list { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.route-list::-webkit-scrollbar { display: none; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats4 div { background: var(--surface); border-radius: 16px; padding: 10px; box-shadow: var(--shadow); min-width: 0; }
.stats4 b { display: block; font: 800 19px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
@media (max-width: 440px) { .stats4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats4 b { font-size: 21px; } }
.stats4 span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.elev svg { width: 100%; height: auto; display: block; }
.elev .area { fill: color-mix(in srgb, var(--moss) 22%, transparent); fill: var(--easy); }
.elev .ln { fill: none; stroke: var(--moss); stroke-width: 2; }
.elev text { fill: var(--muted); font: 600 9px var(--font-body); }
.elev .me { fill: var(--dawn); stroke: var(--surface); stroke-width: 2; }
.where { background: var(--forest); color: #eef6f1; border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; }
.where b { font: 800 22px var(--font-display); }
.empty-map { display: grid; place-items: center; text-align: center; gap: 10px; padding: 36px 20px; }
.empty-map svg { width: 44px; height: 44px; color: var(--moss); }

/* ---------- Settings ---------- */
.char-stage { border-radius: 18px; background: radial-gradient(120% 90% at 50% 15%, var(--surface) 0%, var(--surface-2) 60%, var(--line) 100%); overflow: hidden; }
.char-stage canvas { display: block; width: 100%; height: 240px; }
.char-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.char-card { border: 2px solid var(--line); background: var(--surface-2); border-radius: 16px; padding: 12px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.char-card b { font: 800 17px var(--font-display); }
.char-card span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.char-card[aria-checked="true"] { border-color: var(--moss); background: var(--easy); }
.custom { display: grid; gap: 14px; }
.tog[aria-pressed="true"] { background: var(--forest); color: #eef6f1; border-color: transparent; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--moss); }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.switch input { width: 20px; height: 20px; accent-color: var(--moss); }

/* ---------- Guided session ---------- */
.session { position: fixed; inset: 0; z-index: 65; background: var(--bg); display: grid; grid-template-rows: auto auto 1fr; overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.ses-top { display: flex; align-items: center; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; }
.ses-top .btn { padding: 8px 12px; }
.ses-top span { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.ses-prog { flex: 1; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.ses-prog i { display: block; height: 100%; width: 0; background: var(--moss); border-radius: 8px; transition: width .4s; }
.ses-stage { max-width: 560px; width: 100%; margin: 10px auto 0; }
.ses-stage .viewer canvas { aspect-ratio: 4 / 3; max-height: 38vh; }
.ses-body { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px; align-content: start; padding-top: 14px; }
.ses-what { display: grid; gap: 6px; justify-items: start; }
.ses-what h2 { font-size: 34px; margin: 0; }
.ses-big { margin: 0; font: 800 64px/1 var(--font-display); font-stretch: 80%; }
.ses-big small { font: 600 18px var(--font-body); color: var(--muted); }
.ses-main { width: 100%; padding: 16px; font-size: 17px; border-radius: 16px; }
.ses-ring { position: relative; width: 190px; height: 190px; justify-self: center; }
.ses-ring svg { width: 190px; height: 190px; transform: rotate(-90deg); }
.ses-ring .tr { fill: none; stroke: var(--line); stroke-width: 12; }

<script>
/* ================= Icons ================= */
const ICON = {
  easy: '<path d="M3 17h14.5a3.5 3.5 0 0 0 3.5-3.5c0-1-.8-1.7-1.8-1.9L14 10.5l-2.5-4L8 8 6 6.5 3 9z"/><path d="M3 20h18"/>',

  str: '<path d="M8.5 8a3.5 3.5 0 1 1 7 0"/><path d="M6 10h12l1 5.5A4.5 4.5 0 0 1 14.6 21H9.4A4.5 4.5 0 0 1 5 15.5z"/>',

const icon = (k, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ================= Plan ================= */
const R = ["rest","Istirahat","Jalan santai atau peregangan",0];
const S = (n) => ["str","Kekuatan",n || "7 gerakan, lihat tab Gerakan",0];
const E = (km, n) => ["easy",`Easy ${km} km`,n || "Road, pace ngobrol",km];
const H = (t, n, km) => ["hill",t,n,km];
const LR = (km, t, n) => ["long",t || `Long run ${km} km`,n,km];
const PHASES = [
  { name: "Fondasi", weeks: [
    [R, E(5), S(), E(5), R, E(4,"Tambah 4× strides 20 detik"), LR(8,null,"Santai, boleh di road")],
    [R, E(6), S(), E(5,"Tambah 4× strides 20 detik"), R, E(5), LR(10,null,"Santai, coba sebagian di tanah")],
    [R, E(6), S(), H("Tempo 20 mnt","Total ±7 km dengan pemanasan",7), R, E(5), LR(12,null,"Pace santai, latih minum")],
    [R, E(5), S("Versi ringan, 2 set per gerakan"), E(5), R, E(4), LR(9,"Long run 9 km","Minggu ringan, pemulihan")],
  ]},
  { name: "Tanjakan & Trail", weeks: [
    [R, H("Hill 6× 1 mnt","Turun jalan kaki sebagai pemulihan",6), S(), E(6), R, E(5), LR(12,"Trail 12 km","Jalur tanah, kenali sepatu trail")],
    [R, H("Hill 8× 1 mnt","Usaha kuat tapi terkontrol",7), S(), E(6), R, E(5), LR(13,"Trail 13 km","Latih turunan: langkah pendek, cepat")],
    [R, H("Hill 6× 2 mnt","Jaga usaha stabil tiap repetisi",7), S(), H("Tempo 25 mnt","Total ±8 km",8), R, E(5), LR(14,"Trail 14 km","Power hiking di tanjakan curam")],
    [R, E(5), S("Versi ringan, 2 set per gerakan"), E(5), R, E(4), LR(10,"Trail 10 km","Minggu ringan, pace santai")],
    [R, H("Hill 8× 2 mnt","Tanjakan lebih panjang bila ada",8), S(), E(7), R, E(5), LR(15,"Trail 15 km","Bawa rompi hidrasi + gel")],
    [R, H("Hill 10× 1,5 mnt","Fokus postur saat lelah",8), S(), H("Tempo 30 mnt","Total ±9 km",9), R, E(5), LR(16,"Trail 16 km","Jarak lomba, santai saja")],
  ]},
  { name: "Puncak", weeks: [
    [R, H("Hill 8× 2 mnt","Pemanasan 15 mnt dulu",8), S(), E(7), R, E(5), LR(18,"Simulasi 18 km","Sepatu, rompi, dan gel hari H")],
    [R, H("Hill 10× 2 mnt","Sesi tanjakan terberat",9), S(), H("Tempo 30 mnt","Total ±9 km",9), R, E(5), LR(20,"Trail 20 km","Long run terpanjang, boleh banyak jalan")],
    [R, E(6), S(), H("Hill 6× 2 mnt","Pemanasan 15 mnt dulu",7), ["rest","Istirahat","Tahun baru, nikmati",0], E(5), LR(16,"Trail 16 km","Sebaiknya saat/sesudah hujan")],
  ]},
  { name: "Taper", weeks: [
    [R, E(6,"Tambah 6× strides 20 detik"), S("Versi ringan, 1–2 set per gerakan"), H("Tempo 15 mnt","Total ±6 km",6), R, E(4), LR(10,"Trail 10 km","Santai, cek perlengkapan")],
    [R, E(5,"Tambah 4× strides 20 detik"), R, E(4,"Tambah 4× strides, lalu selesai"), R, ["easy","Shakeout 15–20 mnt","Siapkan perlengkapan, tidur cukup",3], ["race","Lelono 16K","Hari lomba di Kusuma Agrowisata, Batu",16]],
  ]},
];
const START = new Date(2026, 9, 5), RACE = new Date(2027, 0, 17);
const DOW = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
const DOWL = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const MON = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = (d) => `${d.getDate()} ${MON[d.getMonth()]}`;
const TYPE_LABEL = { easy: "Easy run", hill: "Tanjakan / tempo", long: "Long run", str: "Kekuatan", rest: "Istirahat", race: "Hari lomba" };

const PLAN = []; const BYKEY = {};
{ let w = 0;
  PHASES.forEach((p, pi) => p.weeks.forEach((days) => {
    days.forEach((d, i) => {
      const date = addDays(START, w * 7 + i);
      const day = { key: keyOf(date), date, dow: i, week: w, phase: pi, type: d[0], title: d[1], note: d[2], km: d[3] };
      PLAN.push(day); BYKEY[day.key] = day;
    });
    w++;
  }));
}
const WEEKS = 15;

/* ================= Storage (keys kept from earlier versions so progress carries over) ================= */
const STORE_KEY = "lelono16k-v1";
let state = { v: 1, log: {} };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && typeof s.log === "object") state = s; } catch (e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); syncReminderData(); return true; }
  catch (e) { toast("Gagal menyimpan. Penyimpanan browser penuh atau diblokir."); return false; }
}
const entry = (k) => state.log[k] || {};
function setEntry(k, patch) {
  const e = { ...entry(k), ...patch };
  if (!e.done && e.km == null && !e.rpe && !e.note) delete state.log[k]; else state.log[k] = e;
  return persist();
}

/* ================= Helpers ================= */
let TODAY = keyOf(new Date());
const todayDate = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
function currentDay() {
  if (BYKEY[TODAY]) return BYKEY[TODAY];
  return todayDate() < START ? PLAN[0] : PLAN[PLAN.length - 1];
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const doneKm = (d) => { const e = entry(d.key); return e.done ? (e.km != null ? e.km : d.km) : 0; };
const isPast = (d) => d.key < TODAY;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function celebrate(fromEl) {
  if (reduceMotion || !fromEl) return;
  const r = fromEl.getBoundingClientRect();
  const wrap = document.createElement("div");
  wrap.className = "burst";
  wrap.style.left = r.left + r.width / 2 + "px"; wrap.style.top = r.top + r.height / 2 + "px";
  const cols = ["var(--dawn)", "var(--moss)", "var(--water)", "#ffffff"];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement("i");
    const a = (Math.PI * 2 * i) / 22 + Math.random() * .3, dist = 70 + Math.random() * 90;
    p.style.setProperty("--dx", Math.cos(a) * dist + "px");
    p.style.setProperty("--dy", Math.sin(a) * dist - 40 + "px");
    p.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");
    p.style.background = cols[i % cols.length];
    p.style.animationDelay = Math.random() * 60 + "ms";
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1100);
  if (navigator.vibrate) try { navigator.vibrate(18); } catch (e) {}
}

function extraFor(d) {
  const runBtn = `<button type="button" class="btn amber" data-free-run="1">Mulai lari dan rekam</button>`;
  if (d.type === "str") return `<div class="extra"><b>Gerakan hari ini</b><ul>
      <li>Squat 3×12</li><li>Lunges jalan 3×10 per kaki</li><li>Step-up 3×10 per kaki</li>
      <li>Calf raise satu kaki 3×15 per kaki</li><li>Plank 3×40 detik</li><li>Side plank 2×30 detik per sisi</li>
      <li>Single-leg deadlift 2×10 per kaki</li></ul>
      <button type="button" class="btn amber" data-session="1">Mulai latihan terpandu</button>

  if (d.type === "hill" && d.title.startsWith("Hill")) return `<div class="extra"><b>Cara melakukan</b><ol>

  if (d.type === "easy" && /strides/i.test(d.note)) return `<div class="extra"><b>Strides</b><p style="margin:0">Di akhir lari: 20 detik cepat tapi rileks, hampir sprint, lalu jalan 40 detik. Ulangi sesuai jumlah.</p></div>`;

const RPE = [["1","Sangat ringan"],["2","Ringan"],["3","Sedang"],["4","Berat"],["5","Sangat berat"]];
function logForm(d, onChange) {
  const e = entry(d.key);
  const wrap = document.createElement("div");
  wrap.className = "card";
  const runType = d.type !== "str" && d.type !== "rest";
  const id = (s) => `${s}-${d.key}`;
  wrap.innerHTML = `
    ${extraFor(d)}
    <button type="button" class="done-btn" aria-pressed="${e.done ? "true" : "false"}"><span class="ck">${icon("check")}</span><span class="lbl">${e.done ? "Selesai" : "Tandai selesai"}</span></button>
    ${runType ? `<div class="field"><label for="${id("km")}">Jarak aktual (km)</label>
      <input id="${id("km")}" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Rencana: ${d.km} km" value="${e.km ?? ""}"></div>` : ""}
    ${d.type !== "rest" ? `<div class="field"><span class="lbl" id="${id("rpel")}">Rasanya</span>
      <div class="rpe" role="group" aria-labelledby="${id("rpel")}">${RPE.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(e.rpe) === v}"><b>${v}</b>${l}</button>`).join("")}</div></div>` : ""}
    <div class="field"><label for="${id("note")}">Catatan atau keluhan</label>
      <textarea id="${id("note")}" placeholder="Rute, cuaca, rasa kaki, pace, keluhan…">${esc(e.note)}</textarea></div>
    <div class="saved" aria-live="polite"></div>`;
  const saved = wrap.querySelector(".saved");
  const ok = () => { saved.textContent = "Tersimpan di HP ini"; onChange && onChange(); };
  const btn = wrap.querySelector(".done-btn");
  btn.addEventListener("click", () => {
    const v = !entry(d.key).done;
    if (setEntry(d.key, { done: v })) {
      btn.setAttribute("aria-pressed", String(v)); btn.querySelector(".lbl").textContent = v ? "Selesai" : "Tandai selesai";
      if (v) { celebrate(btn); toast(d.type === "race" ? "Selamat, finisher!" : "Mantap, sesi tercatat"); }
      ok();
    }
  });
  const km = wrap.querySelector("input[type=number]");
  if (km) km.addEventListener("input", () => {
    const v = km.value.trim() === "" ? null : Math.max(0, parseFloat(km.value.replace(",", ".")));
    if (setEntry(d.key, { km: Number.isFinite(v) ? v : null })) ok();
  });
  wrap.querySelectorAll(".rpe button").forEach((b) => b.addEventListener("click", () => {
    const cur = entry(d.key).rpe, v = Number(b.dataset.v);
    const nv = cur === v ? null : v;
    if (setEntry(d.key, { rpe: nv })) {
      wrap.querySelectorAll(".rpe button").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.v) === nv)));
      ok();
    }
  }));
  const note = wrap.querySelector("textarea");
  let nt; note.addEventListener("input", () => { clearTimeout(nt); nt = setTimeout(() => { if (setEntry(d.key, { note: note.value.trim() })) ok(); }, 350); });
  return wrap;
}

function renderCal() {
  const v = document.getElementById("v-cal");

function renderProg() {
  const v = document.getElementById("v-prog");
  const sessAll = PLAN.filter((d) => d.type !== "rest");
  const done = sessAll.filter((d) => entry(d.key).done);
  const kmDone = PLAN.reduce((a, d) => a + doneKm(d), 0);
  const kmPlan = PLAN.reduce((a, d) => a + d.km, 0);
  const cw = currentDay().week;
  const wk = sessAll.filter((d) => d.week === cw);
  const wkDone = wk.filter((d) => entry(d.key).done).length;
  const pct = Math.round((done.length / sessAll.length) * 100);
  const C = 2 * Math.PI * 56;

  const plan = [], act = [];
  for (let w = 0; w < WEEKS; w++) {
    const days = PLAN.filter((d) => d.week === w);
    plan.push(days.reduce((a, d) => a + d.km, 0));
    act.push(days.reduce((a, d) => a + doneKm(d), 0));
  }
  const top = Math.max(20, Math.ceil(Math.max(...plan, ...act) / 20) * 20);
  const X0 = 26, X1 = 334, Y0 = 8, Y1 = 128, bw = (X1 - X0) / WEEKS;
  const y = (k) => Y1 - (k / top) * (Y1 - Y0);
  let svg = "";
  for (let t = 0; t <= top; t += 20) svg += `<line class="grid" x1="${X0}" x2="${X1}" y1="${y(t)}" y2="${y(t)}"/><text x="${X0 - 5}" y="${y(t) + 3}" text-anchor="end">${t}</text>`;
  for (let w = 0; w < WEEKS; w++) {
    const x = X0 + w * bw + bw * 0.18, wd = bw * 0.64;
    svg += `<rect class="bar-plan" x="${x}" y="${y(plan[w])}" width="${wd}" height="${Y1 - y(plan[w])}" rx="3"/>`;
    if (act[w] > 0) svg += `<rect class="bar-done" x="${x + wd * 0.2}" y="${y(Math.min(act[w], top))}" width="${wd * 0.6}" height="${Y1 - y(Math.min(act[w], top))}" rx="2"/>`;
    svg += `<text x="${x + wd / 2}" y="${Y1 + 13}" text-anchor="middle" class="${w === cw ? "cur" : ""}">${w + 1}</text>`;
  }
  const logs = PLAN.filter((d) => { const e = entry(d.key); return e.note || e.rpe; }).slice(-6).reverse();
  v.innerHTML = `
    <div><h2>Progres</h2><p class="lede">Semua yang sudah kamu catat sejak 5 Oktober.</p></div>
    <div class="card">
      <div class="ring-wrap">
        <div class="ring"><svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="56" fill="none" stroke-width="12"/>
          <circle class="bar" id="ring-bar" cx="66" cy="66" r="56" fill="none" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
          <div class="lbl"><b>${pct}%</b><span>program selesai</span></div></div>
        <div class="kv">
          <div><b>${done.length} / ${sessAll.length}</b><span>sesi selesai</span></div>
          <div><b>${kmDone % 1 ? kmDone.toFixed(1) : kmDone} km</b><span>dari ${kmPlan} km rencana</span></div>
          <div><b>${wkDone} / ${wk.length}</b><span>sesi minggu ini</span></div>
        </div>
      </div>
    </div>
    <div class="card chart">
      <h3>Km per minggu</h3>
      <svg viewBox="0 0 340 145" role="img" aria-label="Grafik km rencana dan km tercatat per minggu">${svg}</svg>
      <div class="legend"><span><i style="background:var(--line)"></i>Rencana</span><span><i style="background:var(--moss)"></i>Tercatat</span></div>
      <p class="muted" style="margin:0;font-size:13px">Sesi yang ditandai selesai tanpa jarak dihitung sesuai rencana.</p>
    </div>
    <div class="card">
      <h3>Catatan terakhir</h3>
      ${logs.length ? `<ul class="logs">${logs.map((d) => { const e = entry(d.key);
        return `<li><small>${DOWL[d.dow]} ${fmt(d.date)}, ${esc(d.title)}${e.rpe ? `, rasa ${e.rpe}/5` : ""}</small>${e.note ? `<span>${esc(e.note)}</span>` : ""}</li>`; }).join("")}</ul>`
      : `<p class="muted" style="margin:0">Belum ada catatan. Setelah latihan, buka sesi hari itu lalu isi rasa dan catatanmu.</p>`}
    </div>
    <div class="card">
      <h3>Cadangan data</h3>
      <p class="muted" style="margin:0;font-size:14px">Progres tersimpan di HP ini. Simpan cadangan sebelum ganti HP atau menghapus data browser.</p>
      <div class="btns">
        <button type="button" class="btn" id="exp">Simpan cadangan</button>
        <label class="btn" for="imp">Pulihkan cadangan</label>
        <input id="imp" type="file" accept="application/json,.json" class="sr">
        <button type="button" class="btn danger" id="reset">Hapus semua</button>
      </div>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = v.querySelector("#ring-bar"); if (b) b.style.strokeDashoffset = String(C * (1 - pct / 100)); }));
  v.querySelector("#exp").addEventListener("click", exportData);
  v.querySelector("#imp").addEventListener("change", importData);
  const rb = v.querySelector("#reset");
  rb.addEventListener("click", () => {
    if (!rb.classList.contains("armed")) { rb.classList.add("armed"); rb.textContent = "Ketuk lagi untuk menghapus"; setTimeout(() => { rb.classList.remove("armed"); rb.textContent = "Hapus semua"; }, 4000); return; }
    state = { v: 1, log: {} }; persist(); renderAll(); toast("Semua catatan dihapus");
  });
}

function downloadFile(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportData() {
  downloadFile(`zein-trail-cadangan-${TODAY}.json`, JSON.stringify({ app: "zeintrail", ...state, exported: new Date().toISOString() }, null, 2), "application/json");
  toast("Cadangan disimpan ke folder unduhan");
}
function importData(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || typeof s.log !== "object") throw new Error();
      state = { v: 1, log: s.log }; persist(); renderAll(); toast("Cadangan dipulihkan");
    } catch (e) { toast("File ini bukan cadangan Zein Trail"); }
    ev.target.value = "";
  };
  r.readAsText(f);
}

let sheetClose = null;
function openSheet(html, label, after, onClose) {
  const root = document.getElementById("sheet-root");
  const prev = document.activeElement;
  root.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="sheet-in">
    <div class="grab"></div><button type="button" class="sheet-close">Tutup</button>${html}</div></div>`;
  const close = () => { if (onClose) { const f = onClose; onClose = null; f(); } root.innerHTML = ""; sheetClose = null; document.removeEventListener("keydown", onKey); prev && prev.focus && prev.focus(); };
  sheetClose = close;
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  root.querySelector(".scrim").addEventListener("click", close);
  root.querySelector(".sheet-close").addEventListener("click", close);
  root.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { close(); show(b.dataset.go); }));
  after && after(root.querySelector(".sheet-in"), close);
  root.querySelector(".sheet-close").focus();
}

const TABS = ["today", "cal", "route", "moves", "prog", "coach"];
let currentTab = "today";
function show(v) {
  TABS.forEach((n) => {
    const el = document.getElementById("v-" + n);
    el.hidden = n !== v;
    el.classList.remove("enter");
    if (n === v && !reduceMotion) { void el.offsetWidth; el.classList.add("enter"); }
  });
  document.querySelectorAll(".tab").forEach((t) => { if (t.dataset.v === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
  document.getElementById("tab-ind").style.transform = `translateX(${TABS.indexOf(v) * 100}%)`;
  window.scrollTo(0, 0);
  if (v === "cal") { const el = document.getElementById("wk-" + currentDay().week); if (el) el.scrollIntoView({ block: "start" }); }
  if (window.Runner3D) Runner3D.setActive(v === "today");

  if (typeof routeShown === "function") routeShown(v === "route");

  try { localStorage.setItem("lelono16k-tab", v); } catch (e) {}

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => show(t.dataset.v)));
document.addEventListener("click", (e) => {

});

/* ================= Konfirmasi keluar (aplikasi terpasang) =================
   Android's back button walks: close sheet → back to Hari Ini → ask before leaving. */
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let leaving = false;
function closeExitBox() { document.querySelector(".exit-box")?.remove(); }
function askExit() {
  if (document.querySelector(".exit-box")) return;
  const box = document.createElement("div");
  box.className = "exit-box"; box.setAttribute("role", "alertdialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", "exit-t");
  box.innerHTML = `<div><h3 id="exit-t">Keluar dari Zein Trail?</h3><p class="muted" style="margin:0">Progres dan catatanmu sudah tersimpan di HP ini.</p>
    <div class="btns"><button type="button" class="btn ghost" id="exit-stay">Tetap di sini</button><button type="button" class="btn primary" id="exit-go">Keluar</button></div></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (e) => { if (e.target === box) closeExitBox(); });
  box.querySelector("#exit-stay").addEventListener("click", closeExitBox);
  box.querySelector("#exit-go").addEventListener("click", () => { leaving = true; closeExitBox(); history.go(-2); });
  box.querySelector("#exit-stay").focus();
}
if (STANDALONE && history.pushState) {
  history.replaceState({ zt: "root" }, "");
  history.pushState({ zt: "guard" }, "");
  window.addEventListener("popstate", () => {
    if (leaving) return;
    history.pushState({ zt: "guard" }, "");
    if (document.querySelector(".exit-box")) { closeExitBox(); return; }
    if (typeof ses !== "undefined" && ses) { endSession(); return; }
    if (typeof run !== "undefined" && run) { toast("Ketuk Selesai untuk mengakhiri lari"); return; }
    if (typeof bld !== "undefined" && bld) { closeBuilder(); return; }
    if (sheetClose) { sheetClose(); return; }
    if (currentTab !== "today") { show("today"); return; }
    askExit();
  });
}

let deferred = null;
const installBtn = document.getElementById("install-btn");
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; installBtn.hidden = false; });
installBtn.addEventListener("click", async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; installBtn.hidden = true; });
window.addEventListener("appinstalled", () => { installBtn.hidden = true; toast("Aplikasi terpasang"); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

<script>
/* ================= Pengingat latihan =================
   1) Kalender HP (.ics): andal di Android & iPhone, notifikasi dari aplikasi kalender.
   2) Notifikasi aplikasi: Android + aplikasi terpasang, lewat Periodic Background Sync (waktunya kira-kira). */
const REMIND_KEY = "zeintrail-remind";
let remind = { time: "05:30", notif: false };
try { const s = JSON.parse(localStorage.getItem(REMIND_KEY)); if (s) remind = { ...remind, ...s }; } catch (e) {}
const saveRemind = () => { try { localStorage.setItem(REMIND_KEY, JSON.stringify(remind)); } catch (e) {} syncReminderData(); updateBell(); };
function updateBell() { const d = document.getElementById("remind-dot"); if (d) d.hidden = !remind.notif; }

/* Data the service worker reads (it cannot see localStorage). */
async function syncReminderData() {
  if (!("caches" in window)) return;
  try {
    const from = keyOf(addDays(todayDate(), -1)), until = keyOf(addDays(todayDate(), 21));
    const days = PLAN.filter((d) => d.key >= from && d.key <= until).map((d) => ({ key: d.key, type: d.type, title: d.title, note: d.note, done: !!entry(d.key).done }));
    const c = await caches.open("zeintrail-data");
    await c.put("./__reminder.json", new Response(JSON.stringify({ ...remind, days }), { headers: { "content-type": "application/json" } }));
  } catch (e) {}
}

function icsEscape(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function buildICS() {
  const [hh, mm] = remind.time.split(":").map(Number);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Zein Trail//ID", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Zein Trail"];
  PLAN.filter((d) => d.type !== "rest" && d.key >= TODAY).forEach((d) => {
    const ymd = d.key.replace(/-/g, "");
    const start = `${ymd}T${String(hh).padStart(2, "0")}${String(mm).padStart(2, "0")}00`;
    const endH = hh + (d.type === "long" || d.type === "race" ? 3 : 1);
    const end = `${ymd}T${String(Math.min(endH, 23)).padStart(2, "0")}${String(mm).padStart(2, "0")}00`;
    lines.push("BEGIN:VEVENT", `UID:zeintrail-${d.key}@zeintrail`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, `DTEND:${end}`,
      `SUMMARY:${icsEscape("Zein Trail: " + d.title)}`, `DESCRIPTION:${icsEscape(`${d.note}\nMinggu ${d.week + 1}, ${PHASES[d.phase].name}. Catat hasilnya di aplikasi Zein Trail.`)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(d.title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

async function enableNotif() {
  if (!("Notification" in window) || !("serviceWorker" in navigator)) { toast("Browser ini belum mendukung notifikasi"); return false; }
  const p = await Notification.requestPermission();
  if (p !== "granted") { toast("Izin notifikasi ditolak. Aktifkan lewat pengaturan browser."); return false; }
  const reg = await navigator.serviceWorker.ready;
  let periodic = false;
  try {
    if ("periodicSync" in reg) {
      const st = await navigator.permissions.query({ name: "periodic-background-sync" });
      if (st.state === "granted") { await reg.periodicSync.register("zt-daily", { minInterval: 6 * 60 * 60 * 1000 }); periodic = true; }
    }
  } catch (e) {}
  remind.notif = true; remind.periodic = periodic; saveRemind();
  return true;
}
async function testNotif() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const d = currentDay();
    await reg.showNotification("Zein Trail: " + d.title, { body: d.type === "rest" ? "Hari istirahat. Tidur cukup ya." : d.note + ". Catat setelah selesai.", icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "zt-test" });
  } catch (e) { toast("Gagal menampilkan notifikasi"); }
}

function openReminders() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const notifOK = "Notification" in window && "serviceWorker" in navigator;
  openSheet(`
    <div><h2>Pengingat latihan</h2><p class="lede">Pilih jam latihanmu, lalu pasang pengingatnya.</p></div>
    <div class="card">
      <div class="field"><label for="r-time">Jam pengingat</label><input id="r-time" type="time" value="${remind.time}"></div>
    </div>
    <div class="card">
      <div class="split"><h3>Lewat kalender HP</h3><span class="badge t-easy">Paling andal</span></div>
      <p style="margin:0;font-size:15px">Semua sesi latihan dimasukkan ke kalender HP lengkap dengan alarm di jam yang kamu pilih. Bisa di Android dan iPhone, tetap jalan walau aplikasi ini tidak dibuka.</p>
      <button type="button" class="btn amber" id="r-ics">Tambahkan ke kalender</button>
      <p class="muted" style="margin:0;font-size:13px">Setelah file terunduh, buka file itu lalu pilih aplikasi kalender. Kalau jadwal berubah, ulangi langkah ini dan sesinya akan diperbarui.</p>
    </div>
    <div class="card">
      <h3>Notifikasi aplikasi</h3>
      ${isIOS ? `<p style="margin:0;font-size:15px">Di iPhone, notifikasi terjadwal dari aplikasi web belum didukung. Pakai pengingat lewat kalender di atas.</p>`
      : notifOK ? `<p style="margin:0;font-size:15px">Untuk Android dengan aplikasi Zein Trail yang sudah terpasang. Android yang menentukan waktu pastinya, jadi notifikasi bisa datang agak meleset dari jam yang dipilih.</p>
        <div class="btns"><button type="button" class="btn primary" id="r-on">${remind.notif ? "Notifikasi aktif" : "Aktifkan notifikasi"}</button>
        <button type="button" class="btn" id="r-test" ${remind.notif ? "" : "hidden"}>Coba notifikasi</button>
        <button type="button" class="btn ghost" id="r-off" ${remind.notif ? "" : "hidden"}>Matikan</button></div>
        <p class="muted" style="margin:0;font-size:13px" id="r-status">${remind.notif ? (remind.periodic ? "Notifikasi harian aktif." : "Izin sudah diberikan, tapi Android belum mengizinkan jadwal otomatis. Biasanya aktif setelah aplikasi sering dibuka. Untuk pengingat yang pasti, pakai kalender.") : ""}</p>`
      : `<p style="margin:0;font-size:15px">Browser ini belum mendukung notifikasi. Pakai pengingat lewat kalender di atas.</p>`}
    </div>`, "Pengingat latihan", (inner) => {
    inner.querySelector("#r-time").addEventListener("change", (e) => { if (/^\d\d:\d\d$/.test(e.target.value)) { remind.time = e.target.value; saveRemind(); toast("Jam pengingat disimpan"); } });
    inner.querySelector("#r-ics").addEventListener("click", () => { downloadFile("zein-trail-jadwal.ics", buildICS(), "text/calendar"); toast("Jadwal kalender diunduh"); });
    inner.querySelector("#r-on")?.addEventListener("click", async () => { if (await enableNotif()) { openReminders(); toast("Notifikasi aktif"); } });
    inner.querySelector("#r-test")?.addEventListener("click", testNotif);
    inner.querySelector("#r-off")?.addEventListener("click", async () => {
      remind.notif = false; saveRemind();
      try { const reg = await navigator.serviceWorker.ready; if ("periodicSync" in reg) await reg.periodicSync.unregister("zt-daily"); } catch (e) {}
      openReminders(); toast("Notifikasi dimatikan");
    });
  });
}
document.getElementById("remind-btn").addEventListener("click", openReminders);
updateBell();
</script>

<script>
/* ================= Pelatih AI (lewat aplikasi Claude) ================= */
function missedRecent(days = 7) {
  const from = keyOf(addDays(todayDate(), -days));
  return PLAN.filter((d) => d.type !== "rest" && d.key < TODAY && d.key >= from && !entry(d.key).done);
}
function missedBanner() {
  const m = missedRecent();
  if (!m.length || !BYKEY[TODAY]) return "";
  return `<div class="card nudge">
    <div><b>${m.length} sesi terlewat</b> dalam 7 hari terakhir</div>
    <div class="list">${m.map((d) => `${DOW[d.dow]} ${fmt(d.date)}: ${esc(d.title)}`).join(", ")}</div>
    <button type="button" class="btn primary" data-ask="missed">Minta saran di Claude</button>
  </div>`;
}
const ASKS = {
  general: { text: "Evaluasi progres latihan saya sejauh ini. Apa yang sudah baik, apa yang perlu diperhatikan, dan bagaimana sebaiknya 7 hari ke depan?" },
  missed: { text: "Saya melewatkan beberapa sesi latihan. Apa yang harus saya lakukan sekarang, dan bagaimana menyesuaikan jadwal ke depan tanpa memaksakan diri atau menambah risiko cedera?" },
};
const BASE = `Tolong bertindak sebagai pelatih lari trail berpengalaman. Saya pelari amatir yang sedang berlatih untuk Lelono 16K by Mantra (trail run 16 km di lereng Gunung Kawi, Batu, Jawa Timur, Minggu 17 Januari 2027). Jalurnya 100% trail: tanjakan, turunan, hutan pinus, melewati air terjun; lomba di musim hujan sehingga jalur basah dan licin. COT edisi sebelumnya sekitar 5 jam.

Program saya 15 minggu (mulai Senin 5 Okt 2026): Fondasi (minggu 1–4), Tanjakan & Trail (minggu 5–10), Puncak (minggu 11–13, long run terpanjang 20 km), Taper (minggu 14–15). Minggu 4 dan 8 minggu ringan. Hari "Kekuatan" = squat, lunges jalan, step-up, calf raise satu kaki, plank, side plank, single-leg deadlift. Skor "rasa" 1 = sangat ringan sampai 5 = sangat berat.

Saat menjawab:
- Bahasa Indonesia santai tapi jelas, langsung ke inti.
- Rujuk tanggal dan sesi spesifik dari data saya, jangan mengarang data yang tidak ada.
- Kalau ada sesi terlewat: jangan suruh mengganti semuanya atau menggandakan volume. Prioritaskan long run dan sesi tanjakan, naikkan volume mingguan maksimal sekitar 10%. Bolong lebih dari 7 hari: kembali bertahap dengan 2–3 lari santai dulu.
- Skor rasa 4–5 berulang atau tanda kelelahan: sarankan pengurangan beban.
- Kalau ada nyeri, cedera, sakit, atau demam: utamakan istirahat dan sarankan periksa ke tenaga kesehatan, jangan mendiagnosis.`;
const ANALYSIS_RULES = `\n- Untuk permintaan ini: maksimal sekitar 250 kata, dan akhiri dengan jadwal 7 hari ke depan per tanggal yang sudah disesuaikan.`;
const CHAT_RULES = `\n- Jawab pertanyaan saya secara ringkas. Boleh bertanya balik kalau informasinya kurang.`;

function buildContext() {
  const td = todayDate();
  const base = td < START ? START : td;
  const from = keyOf(addDays(base, -21)), until = keyOf(addDays(base, 7));
  const sess = PLAN.filter((d) => d.type !== "rest" && d.key <= TODAY);
  const doneN = sess.filter((d) => entry(d.key).done).length;
  const km = PLAN.reduce((a, d) => a + doneKm(d), 0);
  const rows = PLAN.filter((d) => d.key >= from && d.key <= until).map((d) => {
    const e = entry(d.key);
    let st;
    if (e.done) {
      st = "SELESAI";
      if (e.km != null) st += `, aktual ${e.km} km`;
      if (e.rpe) st += `, rasa ${e.rpe}/5`;
    } else if (d.key > TODAY) st = "akan datang";
    else if (d.key === TODAY) st = "hari ini, belum dicatat";
    else st = d.type === "rest" ? "istirahat" : "TERLEWAT";
    if (e.note) st += `, catatan: "${e.note.replace(/\s+/g, " ").slice(0, 160)}"`;
    return `${d.key} ${DOW[d.dow]} (M${d.week + 1}): ${d.title}${d.km ? ` (${d.km} km)` : ""} → ${st}`;
  });
  const d = currentDay();
  const diff = Math.round((RACE - td) / 86400000);
  return `Hari ini ${DOWL[(td.getDay() + 6) % 7]}, ${TODAY}. Minggu ${d.week + 1}/15, fase ${PHASES[d.phase].name}. ${diff > 0 ? diff + " hari menuju lomba." : "Lomba sudah lewat."}
Total sejauh ini: ${doneN} dari ${sess.length} sesi selesai, ${km % 1 ? km.toFixed(1) : km} km tercatat.

Data latihan saya (3 minggu terakhir sampai 7 hari ke depan):
${rows.join("\n")}`;
}
function composePrompt(askText, rules) {
  const cond = (document.getElementById("ask-cond")?.value || "").trim();
  return `${BASE}${rules}\n\n${buildContext()}${cond ? `\n\nKondisi atau keluhan saya saat ini: ${cond}` : ""}\n\nPertanyaan saya: ${askText}`;
}
function copyText(t) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true, () => fallbackCopy(t)); } catch (e) {}
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}
function openInClaude(prompt) {
  const copying = copyText(prompt);
  const url = "https://claude.ai/new?q=" + encodeURIComponent(prompt);
  const w = window.open(url, "_blank", "noopener");
  if (!w) location.href = url;
  copying.then((ok) => toast(ok ? "Claude dibuka. Kalau belum terisi, tempel saja" : "Claude dibuka"));
}
function runCoach(kind) { const ask = ASKS[kind]; if (ask) openInClaude(composePrompt(ask.text, ANALYSIS_RULES)); }

function renderCoach() {
  const v = document.getElementById("v-coach"); if (!v) return;
  const m = missedRecent();
  const draft = document.getElementById("ask-text")?.value || "";
  const cond = document.getElementById("ask-cond")?.value || "";
  v.innerHTML = `
    <div><h2>Pelatih AI</h2><p class="lede">Pakai langganan Claude kamu. Aplikasi menyusun progres, catatan, dan keluhanmu, lalu membukanya di Claude.</p></div>
    <div class="card">
      <h3>Analisis</h3>
      <div class="${m.length ? "" : "muted"}" style="font-size:15px">${m.length ? `<b>${m.length} sesi terlewat</b> dalam 7 hari terakhir.` : "Tidak ada sesi terlewat dalam 7 hari terakhir."}</div>
      <div class="stack">
        <button type="button" class="btn primary" data-ask="general">Evaluasi progres saya</button>
        <button type="button" class="btn" data-ask="missed">Saya bolong latihan, apa yang harus saya lakukan?</button>
      </div>
    </div>
    <div class="card">
      <h3>Konsultasi</h3>
      <div class="field"><label for="ask-cond">Kondisi atau keluhan saat ini <span class="muted">(opsional)</span></label>
        <textarea id="ask-cond" placeholder="Contoh: betis kiri kaku sejak kemarin, tidur cuma 5 jam">${esc(cond)}</textarea></div>
      <div class="field"><label for="ask-text">Pertanyaanmu</label>
        <textarea id="ask-text" placeholder="Contoh: Long run hari Minggu tetap jalan?">${esc(draft)}</textarea></div>
      <div class="chips">${["Apa yang sebaiknya saya makan sebelum long run?", "Hujan deras hari ini, latihannya diganti apa?", "Sepatu trail seperti apa yang cocok untuk jalur basah?"].map((s) => `<button type="button" class="chip-q">${esc(s)}</button>`).join("")}</div>
      <button type="button" class="btn amber" id="ask-send">Tanya di Claude</button>
      <details id="preview"><summary style="cursor:pointer;font-weight:700;font-size:14px">Lihat yang akan dikirim ke Claude</summary><pre class="preview" id="preview-text"></pre></details>
    </div>
    <div class="card">
      <h3>Cara kerjanya</h3>
      <ol class="steps">
        <li>Ketuk salah satu tombol di atas.</li>
        <li>Claude terbuka dengan pertanyaan dan data latihanmu sudah terisi. Kalau kolomnya kosong, tempel saja karena ringkasannya sudah tersalin otomatis.</li>
        <li>Kirim. Jawaban dan obrolan lanjutannya ada di Claude, memakai langganan kamu.</li>
      </ol>
      <button type="button" class="btn" id="copy-only">Salin ringkasan latihan saja</button>
    </div>`;
  v.querySelector("#ask-send").addEventListener("click", () => {
    const t = v.querySelector("#ask-text").value.trim();
    if (t.length < 3) { toast("Tulis pertanyaanmu dulu"); v.querySelector("#ask-text").focus(); return; }
    openInClaude(composePrompt(t, CHAT_RULES));
  });
  const pv = () => { v.querySelector("#preview-text").textContent = composePrompt(v.querySelector("#ask-text").value.trim() || "(pertanyaanmu)", CHAT_RULES); };
  v.querySelector("#preview").addEventListener("toggle", pv);
  v.querySelectorAll("#ask-text, #ask-cond").forEach((x) => x.addEventListener("input", () => { if (v.querySelector("#preview").open) pv(); }));
  v.querySelectorAll(".chip-q").forEach((b) => b.addEventListener("click", () => { v.querySelector("#ask-text").value = b.textContent; v.querySelector("#ask-text").focus(); }));
  v.querySelector("#copy-only").addEventListener("click", () => {
    copyText(composePrompt("(tulis pertanyaanmu di sini)", CHAT_RULES)).then((ok) => toast(ok ? "Ringkasan latihan disalin" : "Gagal menyalin"));
  });
}
</script>

<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script>
/* ================= Rute (GPX) =================
   Routes live in IndexedDB on the phone. The track line, elevation profile and GPS position
   work without signal; the map picture underneath needs internet (tiles are not bulk-downloaded). */
const RouteDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("zeintrail", 2);
    r.onupgradeneeded = () => { const db = r.result;
      if (!db.objectStoreNames.contains("routes")) db.createObjectStore("routes", { keyPath: "id" });
      if (!db.objectStoreNames.contains("runs")) db.createObjectStore("runs", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn, store = "routes") => open().then((db) => new Promise((res, rej) => {
    const t = db.transaction(store, mode), req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  const api = (store) => ({ all: () => tx("readonly", (s) => s.getAll(), store), put: (r) => tx("readwrite", (s) => s.put(r), store), del: (id) => tx("readwrite", (s) => s.delete(id), store) });
  window.RunDB = api("runs");
  return api("routes");
})();
const ACTIVE_KEY = "zeintrail-route";
let routes = [], activeRoute = null, lmap = null, meMarker = null, watchId = null, mePos = null, routeVisible = false;

function hav(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function enrich(r) {
  const cum = [0];
  for (let i = 1; i < r.pts.length; i++) cum.push(cum[i - 1] + hav(r.pts[i - 1], r.pts[i]));
  let gain = 0, loss = 0, ref = null, maxE = -Infinity, minE = Infinity;
  const hasEle = r.pts.some((p) => Number.isFinite(p[2]));
  const climbAfter = new Array(r.pts.length).fill(0);
  if (hasEle) {
    r.pts.forEach((p) => { const e = p[2]; if (!Number.isFinite(e)) return; maxE = Math.max(maxE, e); minE = Math.min(minE, e);
      if (ref === null) ref = e; const d = e - ref; if (d >= 3) { gain += d; ref = e; } else if (d <= -3) { loss -= d; ref = e; } });
    let acc = 0, prev = null;
    for (let i = r.pts.length - 1; i >= 0; i--) { const e = r.pts[i][2]; if (Number.isFinite(e)) { if (prev !== null && prev > e) acc += prev - e; prev = e; } climbAfter[i] = acc; }
  }
  return { ...r, cum, dist: cum[cum.length - 1], gain, loss, maxE, minE, hasEle, climbAfter };
}
function parseGPX(text, fileName) {
  const xml = new DOMParser().parseFromString(text, "application/xml");
  if (xml.getElementsByTagName("parsererror").length) throw new Error("bad");
  let nodes = [...xml.getElementsByTagName("trkpt")];
  if (nodes.length < 2) nodes = [...xml.getElementsByTagName("rtept")];
  let pts = nodes.map((n) => {
    const e = n.getElementsByTagName("ele")[0];
    return [parseFloat(n.getAttribute("lat")), parseFloat(n.getAttribute("lon")), e ? parseFloat(e.textContent) : NaN];
  }).filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]));
  if (pts.length < 2) throw new Error("empty");
  const step = Math.ceil(pts.length / 4000);
  if (step > 1) pts = pts.filter((_, i) => i % step === 0 || i === pts.length - 1);
  pts = pts.map((p) => [+p[0].toFixed(6), +p[1].toFixed(6), Number.isFinite(p[2]) ? Math.round(p[2] * 10) / 10 : null]);
  const nm = xml.querySelector("trk > name") || xml.querySelector("metadata > name") || xml.querySelector("rte > name");
  const name = (nm && nm.textContent.trim()) || fileName.replace(/\.gpx$/i, "") || "Rute";
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name.slice(0, 60), pts, added: new Date().toISOString() };
}
async function loadRoutes() {
  try { routes = (await RouteDB.all()).map(enrich).sort((a, b) => a.added < b.added ? 1 : -1); } catch (e) { routes = []; }
  let want = null; try { want = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
  activeRoute = routes.find((r) => r.id === want) || routes[0] || null;
  renderRoute();
}
async function importGPX(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast("File terlalu besar (maks 25 MB)"); return; }
  try {
    const r = parseGPX(await file.text(), file.name);
    await RouteDB.put(r);
    try { localStorage.setItem(ACTIVE_KEY, r.id); } catch (e) {}
    await loadRoutes();
    toast("Rute diimpor");
  } catch (e) {
    toast(e && e.message === "empty" ? "File GPX ini tidak berisi titik rute" : "File ini bukan GPX yang valid");
  }
}
const fmtKm = (m) => (m / 1000).toFixed(m < 10000 ? 2 : 1).replace(".", ",");

function elevSVG(r, meIdx) {
  const W = 340, H = 130, X0 = 30, X1 = 334, Y0 = 8, Y1 = 108;
  if (!r.hasEle) return `<p class="muted" style="margin:0">File ini tidak menyimpan data ketinggian.</p>`;
  const lo = Math.floor(r.minE / 50) * 50, hi = Math.max(lo + 50, Math.ceil(r.maxE / 50) * 50);
  const x = (d) => X0 + (d / r.dist) * (X1 - X0), y = (e) => Y1 - ((e - lo) / (hi - lo)) * (Y1 - Y0);
  const step = Math.max(1, Math.floor(r.pts.length / 300));
  const pts = []; for (let i = 0; i < r.pts.length; i += step) if (Number.isFinite(r.pts[i][2])) pts.push([x(r.cum[i]), y(r.pts[i][2])]);
  const lastI = r.pts.length - 1; if (Number.isFinite(r.pts[lastI][2])) pts.push([x(r.cum[lastI]), y(r.pts[lastI][2])]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${Y1} L${pts[0][0].toFixed(1)} ${Y1} Z`;
  const kmStep = r.dist > 30000 ? 5000 : r.dist > 12000 ? 2000 : 1000;
  let ticks = "";
  for (let d = 0; d <= r.dist + 1; d += kmStep) ticks += `<text x="${x(d)}" y="${Y1 + 14}" text-anchor="middle">${d / 1000}</text>`;
  const grid = [lo, Math.round((lo + hi) / 2), hi].map((e) => `<line class="grid" x1="${X0}" x2="${X1}" y1="${y(e)}" y2="${y(e)}"/><text x="${X0 - 4}" y="${y(e) + 3}" text-anchor="end">${e}</text>`).join("");
  const me = meIdx != null && Number.isFinite(r.pts[meIdx][2]) ? `<circle class="me" cx="${x(r.cum[meIdx])}" cy="${y(r.pts[meIdx][2])}" r="6"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profil ketinggian, ${Math.round(r.minE)} sampai ${Math.round(r.maxE)} meter">${grid}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${ticks}${me}</svg>
    <div class="legend"><span>km</span><span>ketinggian dalam meter</span></div>`;
}

function initMap() {
  const el = document.getElementById("map");

  L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
    maxZoom: 17, subdomains: "abc", crossOrigin: true,
    attribution: 'Peta: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, SRTM | Gaya: © <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)',
  }).addTo(lmap);
  const ll = r.pts.map((p) => [p[0], p[1]]);
  L.polyline(ll, { color: "#10261d", weight: 8, opacity: .55 }).addTo(lmap);
  L.polyline(ll, { color: "#f0a43a", weight: 4.5, opacity: 1 }).addTo(lmap);
  L.circleMarker(ll[0], { radius: 7, color: "#fff", weight: 2, fillColor: "#2f6b4f", fillOpacity: 1 }).bindTooltip("Start").addTo(lmap);

function fitRoute() { if (lmap && activeRoute) lmap.fitBounds(activeRoute.pts.map((p) => [p[0], p[1]]), { padding: [24, 24] }); }
function nearest(r, pos) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < r.pts.length; i++) { const d = hav(pos, r.pts[i]); if (d < bd) { bd = d; best = i; } }
  return { i: best, off: bd };
}
function startLocate() {
  if (!("geolocation" in navigator)) { toast("GPS tidak tersedia di perangkat ini"); return; }
  const btn = document.getElementById("locate"); if (btn) btn.textContent = "Mencari sinyal GPS…";
  watchId = navigator.geolocation.watchPosition((pos) => {
    mePos = [pos.coords.latitude, pos.coords.longitude];
    const r = activeRoute; if (!r) return;
    const n = nearest(r, mePos);
    if (lmap) {
      if (!meMarker) { meMarker = L.circleMarker(mePos, { radius: 9, color: "#fff", weight: 3, fillColor: "#3f97be", fillOpacity: 1 }).addTo(lmap); lmap.setView(mePos, Math.max(lmap.getZoom(), 15)); }
      else meMarker.setLatLng(mePos);
    }
    const w = document.getElementById("where");
    if (w) {
      w.hidden = false;
      const left = r.dist - r.cum[n.i];
      w.innerHTML = n.off > 150
        ? `<span>Kamu sekitar ${n.off >= 1000 ? fmtKm(n.off) + " km" : Math.round(n.off) + " m"} dari jalur</span><b>Titik terdekat: km ${fmtKm(r.cum[n.i])}</b>`
        : `<span>Posisimu di rute</span><b>km ${fmtKm(r.cum[n.i])} dari ${fmtKm(r.dist)}</b><span>Sisa ${fmtKm(left)} km${r.hasEle ? `, masih naik ${Math.round(r.climbAfter[n.i])} m` : ""}${Number.isFinite(r.pts[n.i][2]) ? `. Ketinggian ${Math.round(r.pts[n.i][2])} m` : ""}</span>`;
    }
    const el = document.getElementById("elev"); if (el) el.innerHTML = elevSVG(r, n.i);
    const b = document.getElementById("locate"); if (b) b.textContent = "Berhenti melacak";
  }, (err) => {
    toast(err.code === 1 ? "Izin lokasi ditolak. Aktifkan di pengaturan browser." : "Sinyal GPS belum didapat. Coba di tempat terbuka.");
    stopLocate();
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
function stopLocate(silent) {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  const b = document.getElementById("locate"); if (b) b.textContent = "Lacak posisiku di rute";
  if (meMarker && lmap) { lmap.removeLayer(meMarker); } meMarker = null;
  if (!silent) { const w = document.getElementById("where"); if (w) w.hidden = true; }
}
function toGPX(r) {
  const x = (s) => String(s).replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Zein Trail" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${x(r.name)}</name><trkseg>\n` +
    r.pts.map((p) => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[2] != null ? `<ele>${p[2]}</ele>` : ""}</trkpt>`).join("\n") + `\n</trkseg></trk>\n</gpx>\n`;
}
function routeShown(on) {
  routeVisible = on;
  if (!on) { stopLocate(true); return; }
  if (!lmap) initMap(); else setTimeout(() => lmap.invalidateSize(), 50);
}
loadRoutes();
</script>

window.ZTModel = (() => {

<script>
/* ================= Karakter =================
   One rigged body, dressed four ways. Clothes are painted per vertex from each vertex's
   dominant bone (torso → shirt, thighs → shorts, feet → shoes …); accessories ride on bones. */
window.ZTChar = (() => {
  const KEY = "zeintrail-char";
  const SKINS = ["#e6b48f", "#c98f62", "#9a6440", "#6e4529"];
  const SHIRTS = ["#2f6b4f", "#f0a43a", "#3f97be", "#d4472a", "#eef2ef", "#1d2b24"];
  const SHORTS = ["#1d2b24", "#2f6b4f", "#6b5a43", "#2c3e66", "#eef2ef"];
  const HAIRS = ["#15110f", "#4a2f1d", "#8a5a2b", "#c9c2b8", "#f0a43a"];
  const PRESETS = {
    mannequin: { name: "Mannequin", desc: "Model 3D polos seperti sebelumnya", style: "mannequin" },
    zein: { name: "Zein", desc: "Rambut berantakan, ikat kepala, rompi hidrasi", style: "toon", skin: SKINS[1], shirt: "#2f6b4f", shorts: "#1d2b24", shoes: "#f3f6f4",
      hair: "spiky", hairColor: "#15110f", face: true, headband: true, cap: false, buff: false, vest: true, poles: false, glasses: false },
    hiker: { name: "Pendaki", desc: "Topi trucker, buff, tongkat trail", style: "toon", skin: SKINS[2], shirt: "#f0a43a", shorts: "#6b5a43", shoes: "#3b3f3d",
      hair: "short", hairColor: "#4a2f1d", face: true, headband: false, cap: true, buff: true, vest: false, poles: true, glasses: false },
  };
  const CUSTOM_BASE = { name: "Custom", desc: "Karakter polos, tambah aksesorismu sendiri", style: "toon", skin: SKINS[1], shirt: "#eef2ef", shorts: "#eef2ef", shoes: "#eef2ef",
    hair: "none", hairColor: "#15110f", face: false, headband: false, cap: false, buff: false, vest: false, poles: false, glasses: false };
  let saved = { pick: "mannequin", custom: { ...CUSTOM_BASE } };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) saved = { pick: s.pick || "mannequin", custom: { ...CUSTOM_BASE, ...(s.custom || {}) } }; } catch (e) {}
  const listeners = [];
  function config() { return saved.pick === "custom" ? saved.custom : (PRESETS[saved.pick] || PRESETS.mannequin); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} listeners.forEach((f) => f()); }

  let gradient = null;

    if (gradient) return gradient;

    return gradient;

        const hi = new THREE.Mesh(new THREE.CircleGeometry(.0055, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); hi.position.set(s * .005, .008, .004);
        const brow = mk(new THREE.BoxGeometry(.034, .007, .006), cfg.hairColor || 0x15110f, toon); brow.position.set(0, .04, .004); brow.rotation.z = s * -.28;
        eye.add(white, iris, hi, brow);
