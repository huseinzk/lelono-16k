function place(m, k) {
  const P = build(k);
  const hx = m.anchor ? m.ax - P[m.anchor][0] : (k.hx ?? m.hx ?? 120);
  const gAt = (x) => m.box && x >= m.box[0] && x <= m.box[1] ? GROUND - m.box[2] : GROUND;
  let hy = Infinity;
  for (const n in P) { const y = gAt(hx + P[n][0]) - P[n][1] - (n === "head" ? LEN.head : 0) - 3; if (y < hy) hy = y; }
  const W = {}; for (const n in P) W[n] = [hx + P[n][0], hy + P[n][1]]; return W;
}
function sample(m, time) {
  const seq = m.seq; let total = 0; seq.forEach((s) => total += s[1] + s[2]);
  let tau = time % total;
  for (let i = 0; i < seq.length; i++) {
    const [k, d, hold] = seq[i];
    if (i > 0 && tau < d) return { pose: mixPose(m.K[seq[i-1][0]], m.K[k], ease(tau / d)), hold: false };
    if (i > 0) tau -= d;
    if (tau < hold) return { pose: m.K[k], hold: hold > 1 };
    tau -= hold;
  }
  return { pose: m.K[seq[0][0]], hold: false };
}
const peakTime = (m) => m.seq[0][2] + m.seq[1][1] + Math.min(.2, m.seq[1][2] / 2);
/* ================= Gerakan 3D (model manusia ber-rangka) =================
   The 2D pose engine above (build/place/sample) gives joint positions per frame;
   here they are turned into bone directions on a rigged human and rendered with shadows. */
const Viewer3D = (() => {
  const cv = document.getElementById("viewer-canvas");
  const hint = document.getElementById("viewer-hint");
  const playBtn = document.getElementById("viewer-play");
  if (!window.THREE || !cv) return null;
  const V3 = THREE.Vector3, Q = THREE.Quaternion;
  const S = 0.888 / 84;                       // canvas units → metres (thigh+shin of the rig)
  let renderer, scene, camera, group, model, ground, boxMesh, wallMesh, holdTag;
  const B = {}, rest = new Map();
  let ready = false, active = false, visible = true, raf = 0, last = 0;
  let cur = 0, time = 0, playing = !reduceMotion, yaw = 1.15, target = new V3(0, .8, 0), dist = 3.4, dragging = null;

  const map = (p, pl) => pl === "front" ? new V3((p[0] - 120) * S, (GROUND - p[1]) * S, 0) : new V3(0, (GROUND - p[1]) * S, (p[0] - 120) * S);
  const dirP = (a, b, pl) => map(b, pl).sub(map(a, pl)).normalize();
  function footDir(a, b) { // the rig's ankle→ball bone points ~39° below the sole line
    const dx = b[0] - a[0], dy = b[1] - a[1], t = rad(39);
    const r = [dx * Math.cos(t) - dy * Math.sin(t), dx * Math.sin(t) + dy * Math.cos(t)];
    return new V3(0, -r[1], r[0]).normalize();
  }
  const _a = new V3(), _b = new V3(), _q = new Q(), _w = new Q(), _p = new Q();
  function aim(bone, child, t) {
    bone.updateWorldMatrix(true, false); child.updateWorldMatrix(false, false);
    _a.setFromMatrixPosition(bone.matrixWorld); _b.setFromMatrixPosition(child.matrixWorld);
    const d = _b.sub(_a); if (d.lengthSq() < 1e-10) return; d.normalize();
    _q.setFromUnitVectors(d, t);
    bone.getWorldQuaternion(_w); bone.parent.getWorldQuaternion(_p);
    bone.quaternion.copy(_p.invert().multiply(_q.multiply(_w)));
    bone.updateMatrixWorld(true);
  }
  const world = (o) => new V3().setFromMatrixPosition(o.matrixWorld);

  function cssColors() {
    const cs = getComputedStyle(document.documentElement), g = (n) => cs.getPropertyValue(n).trim();
    const darkMode = matchMedia("(prefers-color-scheme: dark)").matches;
    return { ground: g("--surface-2") || "#f5f9f6", line: g("--line") || "#d5e2da", body: darkMode ? "#c5d3cb" : "#eef2ef", joints: "#2f6b4f", accent: g("--dawn") || "#f0a43a" };
  }
  function init(gltf) {
    const C = cssColors();
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: "low-power" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(34, 1, .05, 40);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5a50, .75));
    const sun = new THREE.DirectionalLight(0xfff3e0, 1.0);
    sun.position.set(2.5, 5, 3); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: .5, far: 15 });
    scene.add(sun);
    group = new THREE.Group(); scene.add(group);
    ground = new THREE.Mesh(new THREE.CircleGeometry(3.2, 48), new THREE.MeshStandardMaterial({ color: C.line, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; group.add(ground);
    boxMesh = new THREE.Mesh(new THREE.BoxGeometry(.8, 1, 1), new THREE.MeshStandardMaterial({ color: 0x8a7a66, roughness: .9 }));
    boxMesh.castShadow = boxMesh.receiveShadow = true; group.add(boxMesh);
    wallMesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.2, .08), new THREE.MeshStandardMaterial({ color: C.line, roughness: 1 }));
    wallMesh.receiveShadow = true; group.add(wallMesh);
    model = gltf.scene;
    model.traverse((o) => {
      if (o.isMesh || o.isSkinnedMesh) {
        o.castShadow = true; o.frustumCulled = false;
        const joints = /joint/i.test(o.material.name);
        o.material = new THREE.MeshStandardMaterial({ color: joints ? C.joints : C.body, roughness: joints ? .45 : .6, metalness: joints ? .1 : 0, skinning: true });
      }
    });
    const get = (n) => model.getObjectByName("mixamorig" + n);
    Object.assign(B, { hips: get("Hips"), spine: get("Spine"), spine1: get("Spine1"), neck: get("Neck"), head: get("Head"), headTop: get("HeadTop_End") });
    for (const [k, side] of [["L", "Left"], ["R", "Right"]]) {
      B[k] = { up: get(side + "UpLeg"), leg: get(side + "Leg"), foot: get(side + "Foot"), toe: get(side + "ToeBase"), arm: get(side + "Arm"), fore: get(side + "ForeArm"), hand: get(side + "Hand") };
    }
    model.traverse((o) => { if (o.isBone) rest.set(o, o.quaternion.clone()); });
    group.add(model);
    holdTag = document.createElement("span"); holdTag.className = "hold-tag"; holdTag.textContent = "Tahan"; holdTag.hidden = true;
    cv.parentElement.appendChild(holdTag);
    // drag to orbit
    cv.addEventListener("pointerdown", (e) => { dragging = { x: e.clientX, yaw }; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
    cv.addEventListener("pointermove", (e) => { if (!dragging) return; yaw = dragging.yaw - (e.clientX - dragging.x) * .01; if (!raf) frame(performance.now()); });
    const end = () => { dragging = null; cv.style.cursor = ""; };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    ready = true;
    hint.textContent = "Geser untuk memutar";
    setMove(cur, true);
    new ResizeObserver(size).observe(cv);
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; loop(); }).observe(cv);
    document.addEventListener("visibilitychange", loop);
    size(); loop();
  }

  const CONTACT = () => [[B.L.foot, .075], [B.R.foot, .075], [B.L.toe, .025], [B.R.toe, .025], [B.L.hand, .03], [B.R.hand, .03],
    [B.L.fore, .05], [B.R.fore, .05], [B.L.leg, .06], [B.R.leg, .06], [B.hips, .1], [B.head, .11]];

  function applyPose(m, W) {
    const pl = m.plane || "sag";
    rest.forEach((q, b) => b.quaternion.copy(q));
    group.rotation.x = 0; model.position.set(0, 0, 0); group.updateMatrixWorld(true);
    const torso = dirP(W.hip, W.sh, pl);
    aim(B.hips, B.spine1, torso); aim(B.spine, B.neck, torso); aim(B.neck, B.headTop, torso);
    [["L", 0], ["R", 1]].forEach(([k, i]) => {
      const b = B[k];
      aim(b.up, b.leg, dirP(W.hip, W["knee" + i], pl));
      aim(b.leg, b.foot, dirP(W["knee" + i], W["ankle" + i], pl));
      if (pl === "sag") aim(b.foot, b.toe, footDir(W["ankle" + i], W["toe" + i]));
      aim(b.arm, b.fore, dirP(W.sh, W["elbow" + i], pl));
      aim(b.fore, b.hand, pl === "front" && i === 0 ? new V3(0, 0, 1) : dirP(W["elbow" + i], W["hand" + i], pl));
    });
    model.updateMatrixWorld(true);
    model.position.add(map(W.hip, pl).sub(world(B.hips)));
    model.updateMatrixWorld(true);
    const box = m.box && pl === "sag" ? [(m.box[0] - 120) * S, (m.box[1] - 120) * S, m.box[2] * S] : null;
    let minY = Infinity;
    for (const [bone, r] of CONTACT()) {
      const p = world(bone);
      const g = box && p.z >= box[0] && p.z <= box[1] ? box[2] : 0;
      minY = Math.min(minY, p.y - r - g);
    }
    model.position.y -= minY;
    group.rotation.x = rad(m.slope || 0);
    group.updateMatrixWorld(true);
  }

  function setMove(i, keepYaw) {
    cur = i; time = reduceMotion ? peakTime(MOVES[i]) : 0;
    if (!ready) return;
    const m = MOVES[i], pl = m.plane || "sag";
    boxMesh.visible = !!m.box; wallMesh.visible = !!m.wall;
    if (m.box) { const z0 = (m.box[0] - 120) * S, z1 = (m.box[1] - 120) * S, h = m.box[2] * S; boxMesh.scale.set(1, h, z1 - z0); boxMesh.position.set(0, h / 2, (z0 + z1) / 2); }
    if (m.wall) { wallMesh.position.set(0, 1.1, (m.wall - 120) * S + .04); }
    // frame the move: centre on the joints across its keyframes
    const pts = [];
    Object.values(m.K).forEach((k) => { const W = place(m, k); ["hip", "sh", "head", "toe0", "toe1", "hand0", "hand1"].forEach((n) => pts.push(map(W[n], pl))); });
    const bb = new THREE.Box3().setFromPoints(pts);
    bb.getCenter(target); target.x = 0;
    const ext = Math.max(bb.max.y - bb.min.y, bb.max.z - bb.min.z, bb.max.x - bb.min.x, 1);
    dist = 1.6 + ext * 1.9;
    if (!keepYaw) yaw = pl === "front" ? .3 : 1.15;
    if (!raf) frame(performance.now());
  }
  function size() {
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (!raf) frame(performance.now());
  }
  function frame(now) {
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    if (playing && !dragging) time += dt;
    const m = MOVES[cur];
    const { pose, hold } = sample(m, time);
    applyPose(m, place(m, pose));
    holdTag.hidden = !hold;
    const cy = target.y + .35;
    camera.position.set(Math.sin(yaw) * dist, cy + .25, target.z + Math.cos(yaw) * dist);
    camera.lookAt(target.x, target.y, target.z);
    renderer.render(scene, camera);
  }
  function loop() {
    cancelAnimationFrame(raf); raf = 0; last = 0;
    if (!ready || !active || !visible || document.visibilityState !== "visible") return;
    if (!playing) { frame(performance.now()); return; }
    const tick = (now) => { frame(now); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
  }
  playBtn.addEventListener("click", () => { playing = !playing; playBtn.textContent = playing ? "Jeda" : "Putar"; loop(); });
  playBtn.textContent = playing ? "Jeda" : "Putar";
  let loading = false;
  function setActive(on) {
    active = on;
    if (on && !ready && !loading) {
      loading = true;
      ZTModel.get().then(init).catch(() => { hint.textContent = "Model 3D gagal dimuat. Buka sekali saat online."; });
    }
    loop();
  }
  return { setMove: (i) => setMove(i), setActive };
})();

/* Move picker + details */
function renderMoveDetail(i) {
  const m = MOVES[i];
  document.querySelectorAll(".move-chip[data-move]").forEach((c) => c.setAttribute("aria-selected", String(Number(c.dataset.move) === i)));
  document.getElementById("move-detail").innerHTML = `
    <div class="split"><h3>${m.name}</h3><span class="badge ${m.trail ? "t-long" : "t-str"}">${icon(m.trail ? "hill" : "str")}${m.dose}</span></div>
    <ol>${m.steps.map((s) => `<li>${s}</li>`).join("")}</ol>
    <p class="avoid t-hill"><b>Hindari:</b> ${m.avoid}</p>`;
}
document.getElementById("move-chips").innerHTML = MOVES.map((m, i) =>
  `<button type="button" class="move-chip" role="tab" data-move="${i}" aria-selected="${i === 0}">${icon(m.trail ? "hill" : "str")}${m.name}</button>`).join("");
document.getElementById("move-chips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-move]"); if (!b) return;
  const i = Number(b.dataset.move);
  renderMoveDetail(i);
  if (Viewer3D) Viewer3D.setMove(i);
  b.scrollIntoView({ inline: "nearest", block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
});
renderMoveDetail(0);

/* ================= Boot ================= */
renderAll();
syncReminderData();
let startTab = "today";
try { const t = localStorage.getItem("lelono16k-tab"); if (TABS.includes(t)) startTab = t; } catch (e) {}
show(startTab);
</script>
</body>
