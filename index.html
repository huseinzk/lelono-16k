<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lelono 16K</title>
<meta name="description" content="Jadwal latihan 15 minggu menuju Lelono 16K dengan catatan progres.">
<meta name="theme-color" content="#1d4a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lelono 16K">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky bib header, one scrolling view per tab, fixed bottom tab bar; day detail opens as a bottom sheet */
:root {
  --bg: #eef2ef; --surface: #ffffff; --fg: #17221d; --muted: #5b6a63; --line: #d3ddd7;
  --accent: #2f6b4f; --accent-fg: #ffffff; --brand: #1d4a36; --brand-fg: #eef2ef;
  --easy: #dcebe2; --easy-fg: #24563f; --hill: #f6e3c4; --hill-fg: #7a4c0e;
  --long: #cfe3ea; --long-fg: #144d61; --str: #e3def0; --str-fg: #4b3d78;
  --rest: #e8ecea; --rest-fg: #66746e; --race: #c8411f; --race-fg: #ffffff;
  --stage: #f5f8f6; --figure: #17221d; --figure-far: #9aaba3; --scrim: rgba(10, 20, 15, .45);
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111815; --surface: #18221e; --fg: #e4ece7; --muted: #95a59d; --line: #2b3832;
  --accent: #7cc4a0; --accent-fg: #0d1a14; --brand: #142e23; --brand-fg: #e4ece7;
  --easy: #1f3a2d; --easy-fg: #a6dcbf; --hill: #3d2f17; --hill-fg: #f0c27c;
  --long: #173541; --long-fg: #9fd3e6; --str: #2a2540; --str-fg: #c6b9f0;
  --rest: #1c2420; --rest-fg: #7f8f88; --race: #e0603c; --race-fg: #160c08;
  --stage: #141c18; --figure: #e4ece7; --figure-far: #56675f; --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.eyebrow { font: 600 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }

/* Header */
.top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-fg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.top h1 { font: 700 26px/1 var(--font-display); margin: 2px 0 0; letter-spacing: .01em; }
.top .eyebrow { opacity: .75; }
.top .grow { flex: 1; min-width: 0; }
.count { text-align: right; }
.count b { display: block; font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.count span { font: 500 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.install { background: var(--brand-fg); color: var(--brand); border: 0; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }

main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 96px); }
.view { display: grid; gap: 16px; }
h2 { font: 700 26px/1.05 var(--font-display); margin: 0; text-wrap: balance; }
h3 { font: 700 20px/1.1 var(--font-display); margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }

/* Type colors */
.t-easy { background: var(--easy); color: var(--easy-fg); }
.t-hill { background: var(--hill); color: var(--hill-fg); }
.t-long { background: var(--long); color: var(--long-fg); }
.t-str  { background: var(--str);  color: var(--str-fg); }
.t-rest { background: var(--rest); color: var(--rest-fg); }
.t-race { background: var(--race); color: var(--race-fg); }
.chip { display: inline-block; font: 600 12px var(--font-mono); padding: 3px 9px; border-radius: 99px; letter-spacing: .02em; }

/* Workout hero (Hari Ini + sheet) */
.hero { border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
.hero .when { font: 600 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.hero .what { font: 700 34px/1 var(--font-display); }
.hero .note { font-size: 15px; }
.extra { display: grid; gap: 8px; }
.extra ul, .extra ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; cursor: pointer; justify-self: start; }

/* Log form */
.log { display: grid; gap: 14px; }
.done-btn { width: 100%; border: 2px solid var(--accent); background: transparent; color: var(--accent); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 17px; cursor: pointer; }
.done-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: 14px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 72px; resize: vertical; }
.rpe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rpe button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 2px; font-size: 12px; line-height: 1.15; cursor: pointer; }
.rpe button b { display: block; font: 700 18px var(--font-display); }
.rpe button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.saved { font: 500 12px var(--font-mono); color: var(--muted); min-height: 1em; }

/* Week strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sd { border: 0; border-radius: 10px; padding: 6px 2px 8px; display: grid; justify-items: center; gap: 2px; cursor: pointer; min-width: 0; }
.sd .d { font: 600 10px var(--font-mono); text-transform: uppercase; opacity: .8; }
.sd .n { font: 700 20px/1 var(--font-display); }
.sd .m { font-size: 12px; height: 14px; line-height: 14px; }
.sd.today { outline: 2px solid var(--fg); outline-offset: 1px; }

/* Calendar */
.phase-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--fg); padding-bottom: 4px; }
.week-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 13px; color: var(--muted); padding: 8px 2px 4px; }
.week-h b { color: var(--fg); font: 700 17px var(--font-display); }
.week-h .km { font-family: var(--font-mono); font-size: 12px; }
.days { display: grid; gap: 5px; }
.row { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: center; border: 0; border-radius: 10px; padding: 9px 12px; text-align: left; cursor: pointer; width: 100%; }
.row .dt { font: 600 11px/1.3 var(--font-mono); text-transform: uppercase; opacity: .85; }
.row .tt { font-weight: 700; font-size: 15px; line-height: 1.2; }
.row .nt { font-size: 13px; opacity: .9; }
.row.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 14px; font-weight: 700; opacity: .7; }
.done .tick { background: currentColor; opacity: 1; }
.done .tick::after { content: "✓"; color: var(--surface); }
.row.done .tt { text-decoration: line-through; text-decoration-thickness: 2px; }
.missed .tick { border-style: dashed; }
.week-block { scroll-margin-top: 90px; }

/* Progress */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tile b { display: block; font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 9px var(--font-mono); }
.chart .cur { fill: var(--fg); font-weight: 600; }
.bar-plan { fill: var(--line); }
.bar-done { fill: var(--accent); }
.grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.logs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.logs li { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.logs li:last-child { border-bottom: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
.btn.danger { color: var(--race); border-color: var(--race); }
.btn.danger.armed { background: var(--race); color: var(--race-fg); }

/* Moves */
.move { padding: 0; overflow: hidden; gap: 0; }
.stage { position: relative; background: var(--stage); border-bottom: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; aspect-ratio: 240 / 215; cursor: pointer; }
.stage .play { position: absolute; right: 10px; bottom: 10px; font: 600 12px var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; cursor: pointer; }
.stage .vw { position: absolute; left: 12px; bottom: 12px; font: 500 11px var(--font-mono); color: var(--muted); }
.move-b { padding: 14px 16px 16px; display: grid; gap: 10px; }
.move-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.avoid { margin: 0; padding: 8px 10px; border-radius: 8px; font-size: 14px; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: none; padding: 6px 0; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; overflow: auto; background: var(--surface);
  border-radius: 18px 18px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.sheet-in { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px; }
.sheet-close { justify-self: end; border: 0; background: var(--bg); border-radius: 99px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 72px); z-index: 20; white-space: nowrap;
  background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.nudge { background: var(--hill); color: var(--hill-fg); border-color: transparent; }
.nudge .list { font-size: 14px; }
.stack { display: grid; gap: 8px; }
.field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.ai-meta { font: 500 11px var(--font-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.ai-out { font-size: 15.5px; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.ai-out h4 { font: 700 19px/1.15 var(--font-display); margin: 14px 0 4px; }
.ai-out h4:first-child { margin-top: 0; }
.ai-out p { margin: 6px 0; }
.ai-out ul { margin: 4px 0; padding-left: 20px; display: grid; gap: 3px; }
.ai-out.live::after { content: "▍"; color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .ai-out.live::after { animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: 0; } } }
.hist details { border-top: 1px solid var(--line); padding: 10px 0; }
.hist details:first-child { border-top: 0; }
.hist summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
.hist summary span { display: block; font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.chat { display: grid; gap: 8px; }
.msg { max-width: 88%; padding: 10px 12px; border-radius: 14px; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
.msg.ai { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.ai h4 { font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-q { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; text-align: left; }
.chat-in { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.chat-in textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; resize: vertical; min-height: 46px; }
.err { background: var(--hill); color: var(--hill-fg); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="grow">
      <div class="eyebrow" id="phase-label">Lelono by Mantra</div>
      <h1>Lelono 16K</h1>
    </div>
    <button class="install" id="install-btn" hidden>Pasang</button>
    <div class="count"><b id="count">–</b><span id="count-l">hari lagi</span></div>
  </div>
</header>

<main>
  <section class="view" id="v-today" aria-label="Hari ini"></section>
  <section class="view" id="v-cal" aria-label="Kalender" hidden></section>
  <section class="view" id="v-moves" aria-label="Gerakan" hidden>
    <div><h2>Panduan Gerakan</h2><p class="muted" style="margin:4px 0 0">Untuk hari Kekuatan: kerjakan semua gerakan, istirahat 45–60 detik antar set. Ketuk animasi untuk menjeda.</p></div>
    <div class="view" id="moves"></div>
  </section>
  <section class="view" id="v-prog" aria-label="Progres" hidden></section>
  <section class="view" id="v-coach" aria-label="Pelatih AI" hidden></section>
</main>

<nav class="tabs" aria-label="Menu">
  <div class="tabs-in">
    <button class="tab" data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hari Ini</button>
    <button class="tab" data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
    <button class="tab" data-v="moves"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M8 21l3-6 3 3v3M11 15l1-6 4 3h3M12 9l-4 1-2 3"/></svg>Gerakan</button>
    <button class="tab" data-v="prog"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progres</button>
    <button class="tab" data-v="coach"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg>Pelatih</button>
  </div>
</nav>

<div id="sheet-root"></div>

<script>
/* ================= Plan ================= */
const R = ["rest","Istirahat","Jalan santai atau peregangan",0];
const S = (n) => ["str","Kekuatan",n || "7 gerakan, lihat tab Gerakan",0];
const E = (km, n) => ["easy",`Easy ${km} km`,n || "Road, pace ngobrol",km];
const H = (t, n, km) => ["hill",t,n,km];
const L = (km, t, n) => ["long",t || `Long run ${km} km`,n,km];
const PHASES = [
  { name: "Fondasi", weeks: [
    [R, E(5), S(), E(5), R, E(4,"Tambah 4× strides 20 detik"), L(8,null,"Santai, boleh di road")],
    [R, E(6), S(), E(5,"Tambah 4× strides 20 detik"), R, E(5), L(10,null,"Santai, coba sebagian di tanah")],
    [R, E(6), S(), H("Tempo 20 mnt","Total ±7 km dengan pemanasan",7), R, E(5), L(12,null,"Pace santai, latih minum")],
    [R, E(5), S("Versi ringan, 2 set per gerakan"), E(5), R, E(4), L(9,"Long run 9 km","Minggu ringan, pemulihan")],
  ]},
  { name: "Tanjakan & Trail", weeks: [
    [R, H("Hill 6× 1 mnt","Turun jalan kaki sebagai pemulihan",6), S(), E(6), R, E(5), L(12,"Trail 12 km","Jalur tanah, kenali sepatu trail")],
    [R, H("Hill 8× 1 mnt","Usaha kuat tapi terkontrol",7), S(), E(6), R, E(5), L(13,"Trail 13 km","Latih turunan: langkah pendek, cepat")],
    [R, H("Hill 6× 2 mnt","Jaga usaha stabil tiap repetisi",7), S(), H("Tempo 25 mnt","Total ±8 km",8), R, E(5), L(14,"Trail 14 km","Power hiking di tanjakan curam")],
    [R, E(5), S("Versi ringan, 2 set per gerakan"), E(5), R, E(4), L(10,"Trail 10 km","Minggu ringan, pace santai")],
    [R, H("Hill 8× 2 mnt","Tanjakan lebih panjang bila ada",8), S(), E(7), R, E(5), L(15,"Trail 15 km","Bawa rompi hidrasi + gel")],
    [R, H("Hill 10× 1,5 mnt","Fokus postur saat lelah",8), S(), H("Tempo 30 mnt","Total ±9 km",9), R, E(5), L(16,"Trail 16 km","Jarak lomba, santai saja")],
  ]},
  { name: "Puncak", weeks: [
    [R, H("Hill 8× 2 mnt","Pemanasan 15 mnt dulu",8), S(), E(7), R, E(5), L(18,"Simulasi 18 km","Sepatu, rompi, dan gel hari H")],
    [R, H("Hill 10× 2 mnt","Sesi tanjakan terberat",9), S(), H("Tempo 30 mnt","Total ±9 km",9), R, E(5), L(20,"Trail 20 km","Long run terpanjang, boleh banyak jalan")],
    [R, E(6), S(), H("Hill 6× 2 mnt","Pemanasan 15 mnt dulu",7), ["rest","Istirahat","Tahun baru, nikmati",0], E(5), L(16,"Trail 16 km","Sebaiknya saat/sesudah hujan")],
  ]},
  { name: "Taper", weeks: [
    [R, E(6,"Tambah 6× strides 20 detik"), S("Versi ringan, 1–2 set per gerakan"), H("Tempo 15 mnt","Total ±6 km",6), R, E(4), L(10,"Trail 10 km","Santai, cek perlengkapan")],
    [R, E(5,"Tambah 4× strides 20 detik"), R, E(4,"Tambah 4× strides, lalu selesai"), R, ["easy","Shakeout 15–20 mnt","Siapkan perlengkapan, tidur cukup",3], ["race","LELONO 16K","Kusuma Agrowisata, Batu",16]],
  ]},
];
const START = new Date(2026, 9, 5), RACE = new Date(2027, 0, 17);
const DOW = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
const DOWL = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const MON = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = (d) => `${d.getDate()} ${MON[d.getMonth()]}`;
const TYPE_LABEL = { easy: "Easy run", hill: "Tanjakan / tempo", long: "Long run", str: "Kekuatan", rest: "Istirahat", race: "Lomba" };

const PLAN = []; const BYKEY = {};
{ let w = 0;
  PHASES.forEach((p, pi) => p.weeks.forEach((days) => {
    days.forEach((d, i) => {

const WEEKS = 15;

/* ================= Storage ================= */
const STORE_KEY = "lelono16k-v1";
let state = { v: 1, log: {} };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && typeof s.log === "object") state = s; } catch (e) {}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1600);
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }
  catch (e) { toast("Gagal menyimpan. Penyimpanan browser penuh atau diblokir."); return false; }
}
const entry = (k) => state.log[k] || {};
function setEntry(k, patch) {
  const e = { ...entry(k), ...patch };
  if (!e.done && e.km == null && !e.rpe && !e.note) delete state.log[k]; else state.log[k] = e;
  return persist();
}

/* ================= Helpers ================= */

const doneKm = (d) => { const e = entry(d.key); return e.done ? (e.km != null ? e.km : d.km) : 0; };

const RPE = [["1","Sangat ringan"],["2","Ringan"],["3","Sedang"],["4","Berat"],["5","Sangat berat"]];
function logForm(d, onChange) {

function renderProg() {

function importData(ev) {

function md(src) {

  let out = "", inList = false;
  const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-*•]\s+/.test(l) || /^\d+[.)]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(l.replace(/^([-*•]|\d+[.)])\s+/, ""))}</li>`; continue; }

    if (/^#{1,4}\s+/.test(l)) out += `<h4>${inline(l.replace(/^#{1,4}\s+/, ""))}</h4>`;

  }

}

/* One streaming call to Claude. Resolves {text, error}. */
async function askClaude(system, messages, onText) {
  aiBusy = new AbortController();
  setCoachBusy(true);
  let text = "", error = "";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: aiBusy.signal,
      headers: { "content-type": "application/json", "x-api-key": ai.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: ai.model, max_tokens: 1500, stream: true, system, messages }),
    });
    if (!res.ok) { error = aiError(res.status, await res.text().catch(() => "")); throw new Error("http"); }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const evt = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = evt.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        let j; try { j = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (j.type === "content_block_delta" && j.delta && j.delta.type === "text_delta") { text += j.delta.text; onText(text); }
        if (j.type === "error") error = aiError(j.error && j.error.type === "overloaded_error" ? 529 : 0, "");
      }
    }
  } catch (e) {
    if (e.name === "AbortError") error = text ? "" : "Dihentikan.";
    else if (!error) error = "Tidak bisa terhubung ke Anthropic. Periksa koneksi internet lalu coba lagi.";
  }
  aiBusy = null;
  setCoachBusy(false);
  return { text, error };
}

  out.classList.remove("live");
  meta.textContent = ask.label;
  if (text) {
    ai.history = [{ at: new Date().toISOString(), label: ask.label, text, model: ai.model }, ...ai.history].slice(0, 12);
    saveAI();
    meta.textContent = `${ask.label} · ${when(new Date().toISOString())}`;
    renderHistory();
  }
  if (error) { if (!text) out.innerHTML = ""; out.insertAdjacentHTML("beforeend", `<div class="err">${esc(error)}</div>`); }
}

/* Consultation: multi-turn chat */
async function sendChat(q) {
  q = (q || "").trim();
  if (q.length < 2) { toast("Tulis pertanyaanmu dulu"); return; }
  if (!ready()) return;
  ai.chat.push({ role: "user", content: q, at: new Date().toISOString() });
  saveAI();
  const input = document.getElementById("chat-in"); if (input) input.value = "";
  renderChat();
  const list = document.getElementById("chat-list");
  const bubble = document.createElement("div");
  bubble.className = "msg ai ai-out live";
  bubble.innerHTML = `<p class="muted">Sedang mengetik…</p>`;
  list.appendChild(bubble);
  bubble.scrollIntoView({ block: "end", behavior: "smooth" });
  const msgs = ai.chat.slice(-20).map((m) => ({ role: m.role, content: m.content }));
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  const sys = `${BASE}${CHAT_RULES}\n\nData terbaru pelari (diperbarui setiap pesan):\n${buildContext()}`;
  const { text, error } = await askClaude(sys, msgs, (t) => { bubble.innerHTML = md(t); });
  bubble.classList.remove("live");
  if (text) { ai.chat.push({ role: "assistant", content: text, at: new Date().toISOString() }); saveAI(); }
  else ai.chat.pop(), saveAI(); // drop the unanswered question so the thread stays valid
  renderChat();
  if (error) {
    document.getElementById("chat-list").insertAdjacentHTML("beforeend", `<div class="err">${esc(error)}</div>`);
    if (!text) { const inp = document.getElementById("chat-in"); if (inp) inp.value = q; }
  }
}
const SUGGEST = ["Kaki saya pegal setelah long run, normal tidak?", "Apa yang sebaiknya saya makan sebelum long run?", "Hujan deras hari ini, latihannya diganti apa?"];
function renderChat() {
  const list = document.getElementById("chat-list"); if (!list) return;
  if (!ai.chat.length) {
    list.innerHTML = `<p class="muted" style="margin:0;font-size:14px">Tanya apa saja seputar latihan, cedera ringan, nutrisi, perlengkapan, atau strategi lomba. Claude menjawab berdasarkan jadwal dan catatanmu.</p>
      <div class="chips">${SUGGEST.map((s) => `<button type="button" class="chip-q">${esc(s)}</button>`).join("")}</div>`;
    list.querySelectorAll(".chip-q").forEach((b) => b.addEventListener("click", () => sendChat(b.textContent)));
    return;
  }
  list.innerHTML = ai.chat.map((m) => m.role === "user"
    ? `<div class="msg me">${esc(m.content).replace(/\n/g, "<br>")}</div>`
    : `<div class="msg ai ai-out">${md(m.content)}</div>`).join("");
}

function renderHistory() {
  const h = document.getElementById("ai-hist"); if (!h) return;
  if (!ai.history.length) { h.innerHTML = `<p class="muted" style="margin:0">Belum ada analisis. Hasilnya akan tersimpan di sini.</p>`; return; }
  h.innerHTML = ai.history.map((x) => `<details><summary><span>${when(x.at)}</span>${esc(x.label)}</summary><div class="ai-out" style="margin-top:8px">${md(x.text)}</div></details>`).join("");
}

function renderCoach() {
  const v = document.getElementById("v-coach");
  if (!v || aiBusy) return;
  const m = missedRecent();
  const keyed = !!ai.key;
  v.innerHTML = `
    <div><h2>Pelatih AI</h2><p class="muted" style="margin:4px 0 0">Claude membaca jadwal dan catatan latihanmu, lalu memberi analisis dan menjawab pertanyaanmu.</p></div>
    ${keyed ? `
    <div class="card">
      <h3>Analisis</h3>
      <div class="${m.length ? "" : "muted"}" style="font-size:14.5px">${m.length ? `<b>${m.length} sesi terlewat</b> dalam 7 hari terakhir.` : "Tidak ada sesi terlewat dalam 7 hari terakhir."}</div>
      <div class="stack">
        <button type="button" class="btn primary" data-ask="general">Evaluasi progres saya</button>
        <button type="button" class="btn" data-ask="missed">Saya bolong latihan, apa yang harus saya lakukan?</button>
      </div>
    </div>
    <div class="card" id="ai-result" hidden></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h3>Konsultasi</h3>
        ${ai.chat.length ? `<button type="button" class="linkbtn" id="chat-new">Percakapan baru</button>` : ""}</div>
      <div class="chat" id="chat-list" aria-live="polite"></div>
      <div class="chat-in">
        <label class="sr" for="chat-in">Pesan untuk pelatih</label>
        <textarea id="chat-in" rows="2" placeholder="Tulis pertanyaanmu…"></textarea>
        <button type="button" class="btn primary" id="chat-send">Kirim</button>
      </div>
      <button type="button" class="btn" id="ai-stop" hidden>Hentikan</button>
    </div>` : `
    <div class="card">
      <h3>Aktifkan Pelatih AI</h3>
      <ol class="steps">
        <li>Buka <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> dan daftar atau masuk.</li>
        <li>Isi saldo di menu <b>Billing</b>. Biaya dipotong per pemakaian.</li>
        <li>Buka menu <b>API Keys</b> → <b>Create Key</b>, lalu salin kuncinya.</li>
        <li>Tempel di bawah ini, lalu ketuk <b>Simpan</b>.</li>
      </ol>
      ${keyFields()}
      <p class="muted" style="margin:0;font-size:13px">Kunci hanya disimpan di HP ini dan dikirim langsung ke Anthropic. Saat analisis atau konsultasi, jadwal dan catatan latihanmu dikirim ke Claude.</p>
    </div>`}
    <div class="card"><h3>Riwayat analisis</h3><div class="hist" id="ai-hist"></div></div>
    ${keyed ? `<div class="card"><details><summary style="cursor:pointer;font-weight:700">Pengaturan AI</summary><div class="stack" style="margin-top:12px">${keyFields()}
      <button type="button" class="btn danger" id="ai-remove">Hapus kunci dari HP ini</button></div></details></div>` : ""}`;
  renderHistory();
  renderChat();
  v.querySelector("#ai-save")?.addEventListener("click", () => {
    const k = v.querySelector("#ai-key").value.trim();
    const mdl = v.querySelector("#ai-model").value;
    if (k && !/^sk-ant-/.test(k)) { toast("Kunci API Anthropic diawali sk-ant-"); return; }
    if (k) ai.key = k;
    if (MODELS.some((x) => x[0] === mdl)) ai.model = mdl;
    if (!ai.key) { toast("Tempel kunci API dulu"); return; }
    saveAI(); renderCoach(); toast("Pengaturan AI tersimpan");
  });
  v.querySelector("#ai-remove")?.addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Ketuk lagi untuk menghapus"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Hapus kunci dari HP ini"; }, 4000); return; }
    ai.key = ""; saveAI(); renderCoach(); toast("Kunci API dihapus");
  });
  v.querySelector("#chat-send")?.addEventListener("click", () => sendChat(v.querySelector("#chat-in").value));
  v.querySelector("#chat-new")?.addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Ketuk lagi untuk mulai baru"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Percakapan baru"; }, 4000); return; }
    ai.chat = []; saveAI(); renderCoach();
  });
  v.querySelector("#ai-stop")?.addEventListener("click", () => aiBusy && aiBusy.abort());
}
function keyFields() {
  return `<div class="field"><label for="ai-key">Kunci API Anthropic${ai.key ? " (kosongkan kalau tidak diganti)" : ""}</label>
      <input id="ai-key" type="password" autocomplete="off" spellcheck="false" placeholder="${ai.key ? "sk-ant-…" + esc(ai.key.slice(-4)) : "sk-ant-…"}"></div>
    <div class="field"><label for="ai-model">Model</label>
      <select id="ai-model">${MODELS.map(([id, l]) => `<option value="${id}"${id === ai.model ? " selected" : ""}>${l}</option>`).join("")}</select></div>
    <button type="button" class="btn primary" id="ai-save">Simpan</button>`;
}

/* ================= Boot ================= */
renderAll();
let startTab = "today";
try { const t = localStorage.getItem("lelono16k-tab"); if (["today","cal","moves","prog","coach"].includes(t)) startTab = t; } catch (e) {}
show(startTab);
</script>
